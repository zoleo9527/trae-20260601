<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滑雪场运营 - 雪具租赁与押金核验</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1923;--surface:#1a2733;--surface2:#223344;--border:#2d4a5e;--text:#e8edf2;--text2:#8fa3b5;--primary:#3b9eff;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#8b5cf6;--radius:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:15px;padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:12px;color:var(--primary);font-weight:700;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;color:var(--text2);font-size:14px;transition:all .2s;border-left:3px solid transparent}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{color:var(--primary);background:rgba(59,158,255,.08);border-left-color:var(--primary)}
.nav-item .icon{font-size:18px;width:24px;text-align:center}
.main{flex:1;padding:24px;overflow-y:auto}
.page{display:none}.page.active{display:block}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.page-title{font-size:22px;font-weight:700}
.btn{padding:8px 16px;border-radius:var(--radius);border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#2b8ae6}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{opacity:.85}
.btn-warning{background:var(--warning);color:#000}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.85}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{color:var(--text);border-color:var(--text2)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters input,.filters select{padding:7px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;min-width:120px}
.filters input::placeholder{color:var(--text2)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--surface2)}
th{padding:10px 12px;text-align:left;font-weight:600;color:var(--text2);font-size:12px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:hover td{background:rgba(59,158,255,.04)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-rented{background:rgba(59,158,255,.2);color:#3b9eff}.badge-returned{background:rgba(34,197,94,.2);color:#22c55e}
.badge-damaged{background:rgba(245,158,11,.2);color:#f59e0b}.badge-lost{background:rgba(239,68,68,.2);color:#ef4444}
.badge-pending{background:rgba(139,92,246,.2);color:#8b5cf6}.badge-verified{background:rgba(34,197,94,.2);color:#22c55e}
.badge-refunded{background:rgba(59,158,255,.2);color:#3b9eff}.badge-forfeited{background:rgba(239,68,68,.2);color:#ef4444}
.badge-scheduled{background:rgba(139,92,246,.2);color:#8b5cf6}.badge-in_progress{background:rgba(59,158,255,.2);color:#3b9eff}
.badge-completed{background:rgba(34,197,94,.2);color:#22c55e}.badge-no_show{background:rgba(239,68,68,.2);color:#ef4444}
.badge-reported{background:rgba(239,68,68,.2);color:#ef4444}.badge-in_treatment{background:rgba(245,158,11,.2);color:#f59e0b}
.badge-resolved{background:rgba(34,197,94,.2);color:#22c55e}.badge-minor{background:rgba(59,158,255,.2);color:#3b9eff}
.badge-moderate{background:rgba(245,158,11,.2);color:#f59e0b}.badge-severe{background:rgba(239,68,68,.2);color:#ef4444}
.pagination{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:16px}
.pagination button{padding:5px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:13px}
.pagination button:disabled{opacity:.4;cursor:not-allowed}.pagination button.active{background:var(--primary);border-color:var(--primary)}
.pagination .info{font-size:13px;color:var(--text2);margin:0 8px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:100;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:600px;padding:24px;border:1px solid var(--border);position:relative}
.modal-lg{max-width:860px}
.modal h2{font-size:18px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.modal .close-btn{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:600}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px}
.form-group textarea{min-height:60px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions-cell{display:flex;gap:4px;flex-wrap:nowrap}
.link-badge{color:var(--primary);cursor:pointer;text-decoration:underline;font-size:12px}
.detail-section{margin-bottom:20px}
.detail-section h3{font-size:14px;color:var(--primary);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13px}
.detail-grid dt{color:var(--text2)}.detail-grid dd{font-weight:500}
.timeline{border-left:2px solid var(--border);padding-left:16px;margin:12px 0}
.timeline-item{position:relative;padding-bottom:16px}
.timeline-item::before{content:'';position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid var(--surface)}
.timeline-item .time{font-size:11px;color:var(--text2)}.timeline-item .action{font-size:13px;font-weight:500}.timeline-item .detail{font-size:12px;color:var(--text2)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}.empty-state .icon{font-size:48px;margin-bottom:12px}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-card .label{font-size:12px;color:var(--text2);margin-bottom:4px}.stat-card .value{font-size:24px;font-weight:700}
.stat-card .value.blue{color:var(--primary)}.stat-card .value.green{color:var(--success)}.stat-card .value.orange{color:var(--warning)}.stat-card .value.red{color:var(--danger)}
.toast-container{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius);font-size:13px;font-weight:500;animation:slideIn .3s;max-width:360px}
.toast-success{background:var(--success);color:#fff}.toast-error{background:var(--danger);color:#fff}.toast-info{background:var(--primary);color:#fff}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.evidence-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin:8px 0;font-size:13px;max-height:200px;overflow-y:auto;white-space:pre-wrap}
.relation-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.relation-link{padding:4px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--primary);cursor:pointer}.relation-link:hover{border-color:var(--primary)}
</style>
</head>
<body>
<div class="app">
<nav class="sidebar">
<h1>⛷ 滑雪场运营</h1>
<div class="nav-item active" data-page="rentals"><span class="icon">🎿</span>雪具租赁</div>
<div class="nav-item" data-page="coaches"><span class="icon">🏋</span>教练排班</div>
<div class="nav-item" data-page="rescue"><span class="icon">🚑</span>救援记录</div>
<div class="nav-item" data-page="deposit"><span class="icon">💰</span>押金核验</div>
<div class="nav-item" data-page="audit"><span class="icon">📋</span>操作追溯</div>
</nav>
<main class="main">
<div id="page-rentals" class="page active"></div>
<div id="page-coaches" class="page"></div>
<div id="page-rescue" class="page"></div>
<div id="page-deposit" class="page"></div>
<div id="page-audit" class="page"></div>
</main>
</div>
<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
<div class="toast-container" id="toast-container"></div>
<script>
const API={rentals:'/api/rentals',coaches:'/api/coach-schedules',rescue:'/api/rescue-records',deposit:'/api/deposit-verifications',audit:'/api/audit-logs'};
function qs(p){return '?'+Object.entries(p).filter(([,v])=>v!==undefined&&v!==''&&v!==null).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&')}
async function api(url,opts={}){try{const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw new Error(d.error||'请求失败');return d}catch(e){toast(e.message,'error');throw e}}
function toast(msg,type='info'){const c=document.getElementById('toast-container');const t=document.createElement('div');t.className='toast toast-'+type;t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),3500)}
function badge(text,cls){return '<span class="badge badge-'+cls+'">'+text+'</span>'}
const SL={rented:'租用中',returned:'已归还',damaged:'损坏',lost:'丢失',pending:'待处理',verified:'已核验',refunded:'已退还',forfeited:'已扣押',scheduled:'已排班',in_progress:'进行中',completed:'已完成',no_show:'爽约',reported:'已报告',in_treatment:'治疗中',resolved:'已解决',minor:'轻微',moderate:'中等',severe:'严重'};
function sl(s){return SL[s]||s}
function fd(d){return d?new Date(d).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-'}
function fdf(d){return d?new Date(d).toLocaleString('zh-CN'):'-'}

function pagHtml(page,tp,total){let h='<div class="pagination"><button onclick="goPage('+(page-1)+')" '+(page<=1?'disabled':'')+'>上一页</button>';const s=Math.max(1,page-2),e=Math.min(tp,page+2);for(let i=s;i<=e;i++)h+='<button class="'+(i===page?'active':'')+'" onclick="goPage('+i+')">'+i+'</button>';h+='<span class="info">共'+total+'条</span><button onclick="goPage('+(page+1)+')" '+(page>=tp?'disabled':'')+'>下一页</button></div>';return h}

function openModal(html,lg){const m=document.getElementById('modal-content');m.className=lg?'modal modal-lg':'modal';m.innerHTML=html;document.getElementById('modal-overlay').classList.add('show')}
function closeModal(){document.getElementById('modal-overlay').classList.remove('show')}
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal()});

let curPage={rentals:1,coaches:1,rescue:1,deposit:1,audit:1};
let curFilter={rentals:{},coaches:{},rescue:{},deposit:{},audit:{}};
let activePage='rentals';

document.querySelectorAll('.nav-item').forEach(n=>{n.addEventListener('click',()=>{document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));n.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));activePage=n.dataset.page;document.getElementById('page-'+activePage).classList.add('active');loadPage()})});
function goPage(p){curPage[activePage]=p;loadPage()}
function loadPage(){switch(activePage){case 'rentals':loadRentals();break;case 'coaches':loadCoaches();break;case 'rescue':loadRescue();break;case 'deposit':loadDeposit();break;case 'audit':loadAudit();break;}}

async function loadRentals(){
  const f=curFilter.rentals,p=curPage.rentals,data=await api(API.rentals+qs({...f,page:p,pageSize:15})),pg=document.getElementById('page-rentals');
  let rc=0,rt=0,dm=0;data.items.forEach(i=>{if(i.status==='rented')rc++;if(i.status==='returned')rt++;if(i.status==='damaged'||i.status==='lost')dm++;});
  let h='<div class="page-header"><h2 class="page-title">🎿 雪具租赁</h2><button class="btn btn-primary" onclick="showCreateRental()">+ 新建租赁单</button></div>';
  h+='<div class="stat-cards"><div class="stat-card"><div class="label">租赁中</div><div class="value blue">'+rc+'</div></div><div class="stat-card"><div class="label">已归还</div><div class="value green">'+rt+'</div></div><div class="stat-card"><div class="label">损坏/丢失</div><div class="value orange">'+dm+'</div></div></div>';
  h+='<div class="filters"><input placeholder="单号" id="f-r-orderNo" value="'+(f.orderNo||'')+'"><input placeholder="客人姓名" id="f-r-guestName" value="'+(f.guestName||'')+'"><input placeholder="手机号" id="f-r-guestPhone" value="'+(f.guestPhone||'')+'"><select id="f-r-status"><option value="">全部状态</option><option value="rented"'+(f.status==='rented'?' selected':'')+'>租用中</option><option value="returned"'+(f.status==='returned'?' selected':'')+'>已归还</option><option value="damaged"'+(f.status==='damaged'?' selected':'')+'>损坏</option><option value="lost"'+(f.status==='lost'?' selected':'')+'>丢失</option></select><select id="f-r-equipmentType"><option value="">全部雪具</option><option value="双板"'+(f.equipmentType==='双板'?' selected':'')+'>双板</option><option value="单板"'+(f.equipmentType==='单板'?' selected':'')+'>单板</option><option value="雪鞋"'+(f.equipmentType==='雪鞋'?' selected':'')+'>雪鞋</option><option value="雪杖"'+(f.equipmentType==='雪杖'?' selected':'')+'>雪杖</option><option value="头盔"'+(f.equipmentType==='头盔'?' selected':'')+'>头盔</option></select><select id="f-r-depositStatus"><option value="">全部押金</option><option value="pending"'+(f.depositStatus==='pending'?' selected':'')+'>待处理</option><option value="verified"'+(f.depositStatus==='verified'?' selected':'')+'>已核验</option><option value="refunded"'+(f.depositStatus==='refunded'?' selected':'')+'>已退还</option><option value="forfeited"'+(f.depositStatus==='forfeited'?' selected':'')+'>已扣押</option></select><button class="btn btn-primary btn-sm" onclick="filterRentals()">筛选</button><button class="btn btn-ghost btn-sm" onclick="curFilter.rentals={};curPage.rentals=1;loadRentals()">清除</button></div>';
  if(!data.items.length){h+='<div class="empty-state"><div class="icon">🎿</div><p>暂无租赁记录</p></div>';pg.innerHTML=h;return;}
  h+='<table><thead><tr><th>单号</th><th>客人</th><th>手机</th><th>雪具</th><th>编码</th><th>尺码</th><th>押金</th><th>租赁状态</th><th>押金状态</th><th>操作人</th><th>操作</th></tr></thead><tbody>';
  data.items.forEach(i=>{
    h+='<tr><td class="link-badge" onclick="showRentalDetail(\''+i.id+'\')">'+i.orderNo+'</td><td>'+i.guestName+'</td><td>'+i.guestPhone+'</td><td>'+i.equipmentType+'</td><td>'+i.equipmentCode+'</td><td>'+(i.size||'-')+'</td><td>¥'+i.depositAmount+'</td><td>'+badge(sl(i.status),i.status)+'</td><td>'+badge(sl(i.depositStatus),i.depositStatus)+'</td><td>'+i.operatorName+'</td><td class="actions-cell">';
    if(i.status==='rented')h+='<button class="btn btn-success btn-sm" onclick="returnRental(\''+i.id+'\',\'returned\')">归还</button><button class="btn btn-warning btn-sm" onclick="returnRental(\''+i.id+'\',\'damaged\')">损坏</button><button class="btn btn-danger btn-sm" onclick="returnRental(\''+i.id+'\',\'lost\')">丢失</button>';
    h+='<button class="btn btn-ghost btn-sm" onclick="showRentalDetail(\''+i.id+'\')">详情</button></td></tr>';
  });
  h+='</tbody></table>'+pagHtml(data.page,data.totalPages,data.total);
  pg.innerHTML=h;
}
function filterRentals(){curFilter.rentals={orderNo:document.getElementById('f-r-orderNo').value,guestName:document.getElementById('f-r-guestName').value,guestPhone:document.getElementById('f-r-guestPhone').value,status:document.getElementById('f-r-status').value,equipmentType:document.getElementById('f-r-equipmentType').value,depositStatus:document.getElementById('f-r-depositStatus').value};curPage.rentals=1;loadRentals();}

function showCreateRental(){
  openModal('<h2>新建租赁单</h2><form onsubmit="submitRental(event)"><div class="form-row"><div class="form-group"><label>单号*</label><input id="rc-orderNo" required></div><div class="form-group"><label>操作人*</label><input id="rc-operator" required></div></div><div class="form-row"><div class="form-group"><label>客人姓名*</label><input id="rc-guestName" required></div><div class="form-group"><label>手机号*</label><input id="rc-guestPhone" required></div></div><div class="form-group"><label>身份证号</label><input id="rc-idCardNo"></div><div class="form-row"><div class="form-group"><label>雪具类型*</label><select id="rc-equipType" required><option value="">选择</option><option>双板</option><option>单板</option><option>雪鞋</option><option>雪杖</option><option>头盔</option></select></div><div class="form-group"><label>雪具编码*</label><input id="rc-equipCode" required></div></div><div class="form-row"><div class="form-group"><label>尺码</label><input id="rc-size" placeholder="如 170cm / 42码"></div><div class="form-group"><label>押金金额(元)*</label><input id="rc-deposit" type="number" step="0.01" required></div></div><div class="form-group"><label>备注</label><textarea id="rc-notes"></textarea></div><div style="text-align:right;margin-top:16px"><button type="button" class="btn btn-ghost" onclick="closeModal()">取消</button> <button type="submit" class="btn btn-primary">确认创建</button></div></form>');
}
async function submitRental(e){
  e.preventDefault();const b={orderNo:document.getElementById('rc-orderNo').value,guestName:document.getElementById('rc-guestName').value,guestPhone:document.getElementById('rc-guestPhone').value,idCardNo:document.getElementById('rc-idCardNo').value,equipmentType:document.getElementById('rc-equipType').value,equipmentCode:document.getElementById('rc-equipCode').value,size:document.getElementById('rc-size').value,depositAmount:document.getElementById('rc-deposit').value,operatorName:document.getElementById('rc-operator').value,notes:document.getElementById('rc-notes').value};
  const res=await api(API.rentals,{method:'POST',body:JSON.stringify(b)});if(res.created===false)toast('单号已存在，幂等返回','info');else toast('创建成功','success');closeModal();loadRentals();
}
function returnRental(id,status){
  const lb={returned:'归还',damaged:'标记损坏',lost:'标记丢失'};
  openModal('<h2>'+lb[status]+'雪具</h2><div class="form-group"><label>操作人*</label><input id="rr-operator" required></div><div class="form-group"><label>备注</label><textarea id="rr-notes" placeholder="归还检查情况说明…"></textarea></div><div style="text-align:right;margin-top:16px"><button class="btn btn-ghost" onclick="closeModal()">取消</button> <button class="btn btn-'+(status==='returned'?'success':status==='damaged'?'warning':'danger')+'" onclick="submitReturnRental(\''+id+'\',\''+status+'\')">确认'+lb[status]+'</button></div>');
}
async function submitReturnRental(id,status){const op=document.getElementById('rr-operator').value,nt=document.getElementById('rr-notes').value;if(!op){toast('操作人必填','error');return;}await api(API.rentals+'/'+id+'/status',{method:'PUT',body:JSON.stringify({status,operatorName:op,notes:nt})});toast('状态已更新','success');closeModal();loadRentals();}

async function showRentalDetail(id){
  const d=await api(API.rentals+'/'+id);let h='<h2>租赁单详情 - '+d.orderNo+'</h2><button class="close-btn" onclick="closeModal()">✕</button>';
  h+='<div class="detail-section"><h3>基本信息</h3><div class="detail-grid"><dt>单号</dt><dd>'+d.orderNo+'</dd><dt>客人</dt><dd>'+d.guestName+'</dd><dt>手机</dt><dd>'+d.guestPhone+'</dd><dt>身份证</dt><dd>'+(d.idCardNo||'-')+'</dd><dt>雪具</dt><dd>'+d.equipmentType+' / '+d.equipmentCode+' / '+(d.size||'-')+'</dd><dt>押金</dt><dd>¥'+d.depositAmount+'</dd><dt>租赁状态</dt><dd>'+badge(sl(d.status),d.status)+'</dd><dt>押金状态</dt><dd>'+badge(sl(d.depositStatus),d.depositStatus)+'</dd><dt>操作人</dt><dd>'+d.operatorName+'</dd><dt>创建时间</dt><dd>'+fdf(d.createdAt)+'</dd><dt>归还时间</dt><dd>'+fdf(d.returnedAt)+'</dd></div></div>';
  if(d.notes)h+='<div class="detail-section"><h3>备注</h3><div class="evidence-box">'+d.notes+'</div></div>';
  if(d.coachSchedules.length){h+='<div class="detail-section"><h3>关联教练排班 ('+d.coachSchedules.length+')</h3><div class="relation-links">';d.coachSchedules.forEach(c=>{h+='<span class="relation-link" onclick="closeModal();showCoachDetail(\''+c.id+'\')">'+c.coachName+' - '+c.scheduleDate+' '+c.timeSlot+' '+badge(sl(c.status),c.status)+'</span>';});h+='</div></div>';}

  h+='<div class="filters"><select id="f-d-status"><option value="">全部状态</option><option value="pending"'+(f.status==='pending'?' selected':'')+'>待处理</option><option value="verified"'+(f.status==='verified'?' selected':'')+'>已核验</option><option value="refunded"'+(f.status==='refunded'?' selected':'')+'>已退还</option><option value="forfeited"'+(f.status==='forfeited'?' selected':'')+'>已扣押</option></select><select id="f-d-verificationType"><option value="">全部类型</option><option value="return_check"'+(f.verificationType==='return_check'?' selected':'')+'>归还核验</option><option value="damage_assessment"'+(f.verificationType==='damage_assessment'?' selected':'')+'>损坏评估</option></select><input placeholder="核验人" id="f-d-verifierName" value="'+(f.verifierName||'')+'"><button class="btn btn-primary btn-sm" onclick="filterDeposit()">筛选</button><button class="btn btn-ghost btn-sm" onclick="curFilter.deposit={};curPage.deposit=1;loadDeposit()">清除</button></div>';
  if(!data.items.length){h+='<div class="empty-state"><div class="icon">💰</div><p>暂无核验记录</p></div>';pg.innerHTML=h;return;}
  h+='<table><thead><tr><th>租赁单</th><th>客人</th><th>雪具</th><th>类型</th><th>押金</th><th>扣除</th><th>退还</th><th>状态</th><th>核验人</th><th>操作</th></tr></thead><tbody>';
  data.items.forEach(i=>{const r=i.rentalOrder;h+='<tr><td class="link-badge" onclick="showDepositDetail(\''+i.id+'\')">'+(r?r.orderNo:'-')+'</td><td>'+(r?r.guestName:'-')+'</td><td>'+(r?r.equipmentType+' / '+r.equipmentCode:'-')+'</td><td>'+(i.verificationType==='return_check'?'归还核验':'损坏评估')+'</td><td>¥'+i.depositAmount+'</td><td>¥'+i.damageDeducted+'</td><td>'+(i.actualRefund!=null?'¥'+i.actualRefund:'-')+'</td><td>'+badge(sl(i.status),i.status)+'</td><td>'+i.verifierName+'</td><td class="actions-cell">';
  if(i.status==='pending')h+='<button class="btn btn-success btn-sm" onclick="verifyDeposit(\''+i.id+'\',\'verified\')">核验通过</button><button class="btn btn-primary btn-sm" onclick="verifyDeposit(\''+i.id+'\',\'refunded\')">退还</button><button class="btn btn-danger btn-sm" onclick="verifyDeposit(\''+i.id+'\',\'forfeited\')">扣押</button>';
  h+='<button class="btn btn-ghost btn-sm" onclick="showDepositDetail(\''+i.id+'\')">详情</button></td></tr>';});
  h+='</tbody></table>'+pagHtml(data.page,data.totalPages,data.total);pg.innerHTML=h;
}
function filterDeposit(){curFilter.deposit={status:document.getElementById('f-d-status').value,verificationType:document.getElementById('f-d-verificationType').value,verifierName:document.getElementById('f-d-verifierName').value};curPage.deposit=1;loadDeposit();}

async function showCreateDeposit(){
  const rentals=await api(API.rentals+qs({pageSize:100}));
  openModal('<h2>新建押金核验</h2><form onsubmit="submitDeposit(event)"><div class="form-group"><label>关联租赁单*</label><select id="dv-rentalOrderId" required onchange="fillDepositFromRental()"><option value="">选择租赁单</option>'+rentals.items.map(r=>'<option value="'+r.id+'" data-deposit="'+r.depositAmount+'">'+r.orderNo+' - '+r.guestName+' - '+r.equipmentType+' (押金¥'+r.depositAmount+')</option>').join('')+'</select></div><div class="form-row"><div class="form-group"><label>核验类型</label><select id="dv-verificationType"><option value="return_check">归还核验</option><option value="damage_assessment">损坏评估</option></select></div><div class="form-group"><label>押金金额(元)*</label><input id="dv-depositAmount" type="number" step="0.01" required></div></div><div class="form-row"><div class="form-group"><label>损坏扣除(元)</label><input id="dv-damageDeducted" type="number" step="0.01" value="0"></div><div class="form-group"><label>实际退还(元)</label><input id="dv-actualRefund" type="number" step="0.01"></div></div><div class="form-group"><label>损坏说明</label><textarea id="dv-damageNotes" placeholder="划痕、变形、缺失部件等"></textarea></div><div class="form-group"><label>证据照片说明</label><textarea id="dv-evidencePhotos" placeholder="拍照编号、存储路径等"></textarea></div><div class="form-group"><label>核验人*</label><input id="dv-verifierName" required></div><div class="form-group"><label>备注</label><textarea id="dv-notes"></textarea></div><div style="text-align:right;margin-top:16px"><button type="button" class="btn btn-ghost" onclick="closeModal()">取消</button> <button type="submit" class="btn btn-primary">确认创建</button></div></form>');
}
function fillDepositFromRental(){const sel=document.getElementById('dv-rentalOrderId'),opt=sel.options[sel.selectedIndex];if(opt&&opt.dataset.deposit)document.getElementById('dv-depositAmount').value=opt.dataset.deposit;}
async function submitDeposit(e){e.preventDefault();const b={rentalOrderId:document.getElementById('dv-rentalOrderId').value,verificationType:document.getElementById('dv-verificationType').value,depositAmount:document.getElementById('dv-depositAmount').value,actualRefund:document.getElementById('dv-actualRefund').value||null,damageDeducted:document.getElementById('dv-damageDeducted').value||0,damageNotes:document.getElementById('dv-damageNotes').value,evidencePhotos:document.getElementById('dv-evidencePhotos').value,verifierName:document.getElementById('dv-verifierName').value,notes:document.getElementById('dv-notes').value};await api(API.deposit,{method:'POST',body:JSON.stringify(b)});toast('核验记录创建成功','success');closeModal();loadDeposit();}

function verifyDeposit(id,status){const lb={verified:'核验通过',refunded:'退还押金',forfeited:'扣押押金'};openModal('<h2>'+lb[status]+'</h2><div class="form-group"><label>核验人*</label><input id="dv2-verifierName" required></div><div class="form-group"><label>实际退还金额(元)</label><input id="dv2-actualRefund" type="number" step="0.01"></div><div class="form-group"><label>损坏扣除(元)</label><input id="dv2-damageDeducted" type="number" step="0.01" value="0"></div><div class="form-group"><label>损坏说明</label><textarea id="dv2-damageNotes"></textarea></div><div class="form-group"><label>备注</label><textarea id="dv2-notes"></textarea></div><div style="text-align:right;margin-top:16px"><button class="btn btn-ghost" onclick="closeModal()">取消</button> <button class="btn btn-'+(status==='verified'?'success':status==='refunded'?'primary':'danger')+'" onclick="submitVerifyDeposit(\''+id+'\',\''+status+'\')">确认'+lb[status]+'</button></div>');}
async function submitVerifyDeposit(id,status){const vn=document.getElementById('dv2-verifierName').value;if(!vn){toast('核验人必填','error');return;}const b={status,verifierName:vn,actualRefund:document.getElementById('dv2-actualRefund').value||null,damageDeducted:document.getElementById('dv2-damageDeducted').value||0,damageNotes:document.getElementById('dv2-damageNotes').value,notes:document.getElementById('dv2-notes').value};await api(API.deposit+'/'+id+'/verify',{method:'PUT',body:JSON.stringify(b)});toast('核验完成','success');closeModal();loadDeposit();}

async function showDepositDetail(id){
  const d=await api(API.deposit+'/'+id);let h='<h2>核验详情</h2><button class="close-btn" onclick="closeModal()">✕</button>';
  h+='<div class="detail-section"><h3>核验信息</h3><div class="detail-grid"><dt>核验类型</dt><dd>'+(d.verificationType==='return_check'?'归还核验':'损坏评估')+'</dd><dt>押金</dt><dd>¥'+d.depositAmount+'</dd><dt>扣除</dt><dd>¥'+d.damageDeducted+'</dd><dt>实际退还</dt><dd>'+(d.actualRefund!=null?'¥'+d.actualRefund:'-')+'</dd><dt>状态</dt><dd>'+badge(sl(d.status),d.status)+'</dd><dt>核验人</dt><dd>'+d.verifierName+'</dd><dt>核验时间</dt><dd>'+fdf(d.verifiedAt)+'</dd><dt>创建时间</dt><dd>'+fdf(d.createdAt)+'</dd></div></div>';
  if(d.damageNotes)h+='<div class="detail-section"><h3>损坏说明</h3><div class="evidence-box">'+d.damageNotes+'</div></div>';
  if(d.evidencePhotos)h+='<div class="detail-section"><h3>证据照片</h3><div class="evidence-box">'+d.evidencePhotos+'</div></div>';
  if(d.notes)h+='<div class="detail-section"><h3>备注</h3><div class="evidence-box">'+d.notes+'</div></div>';
  if(d.rentalOrder){const r=d.rentalOrder;h+='<div class="detail-section"><h3>关联租赁单</h3><div class="detail-grid"><dt>单号</dt><dd class="link-badge" onclick="closeModal();showRentalDetail(\''+d.rentalOrderId+'\')">'+r.orderNo+'</dd><dt>客人</dt><dd>'+r.guestName+'</dd><dt>雪具</dt><dd>'+r.equipmentType+' / '+r.equipmentCode+'</dd><dt>租赁状态</dt><dd>'+badge(sl(r.status),r.status)+'</dd><dt>押金状态</dt><dd>'+badge(sl(r.depositStatus),r.depositStatus)+'</dd></div></div>';
    if(r.coachSchedules&&r.coachSchedules.length){h+='<div class="detail-section"><h3>该租赁关联教练排班</h3><div class="relation-links">';r.coachSchedules.forEach(c=>{h+='<span class="relation-link" onclick="closeModal();showCoachDetail(\''+c.id+'\')">'+c.coachName+' '+c.scheduleDate+' '+badge(sl(c.status),c.status)+'</span>';});h+='</div></div>';}
    if(r.rescueRecords&&r.rescueRecords.length){h+='<div class="detail-section"><h3>该租赁关联救援记录</h3><div class="relation-links">';r.rescueRecords.forEach(rc=>{h+='<span class="relation-link" onclick="closeModal();showRescueDetail(\''+rc.id+'\')">'+rc.incidentType+' '+badge(sl(rc.severity),rc.severity)+'</span>';});h+='</div></div>';}
  }
  if(d.auditLogs&&d.auditLogs.length){h+='<div class="detail-section"><h3>操作时间线</h3><div class="timeline">';d.auditLogs.forEach(l=>{h+='<div class="timeline-item"><div class="time">'+fdf(l.createdAt)+'</div><div class="action">'+l.action+': '+(sl(l.fromStatus)||'—')+' → '+sl(l.toStatus)+'</div><div class="detail">操作人: '+l.operatorName+(l.notes?' | '+l.notes:'')+'</div></div>';});h+='</div></div>';}
  openModal(h,true);
}

async function loadAudit(){
  const f=curFilter.audit,p=curPage.audit,data=await api(API.audit+qs({...f,page:p,pageSize:20})),pg=document.getElementById('page-audit');
  const TL={RentalOrder:'租赁单',CoachSchedule:'教练排班',RescueRecord:'救援记录',DepositVerification:'押金核验'};
  let h='<div class="page-header"><h2 class="page-title">📋 操作追溯</h2></div>';
  h+='<div class="filters"><select id="f-a-entityType"><option value="">全部类型</option><option value="RentalOrder"'+(f.entityType==='RentalOrder'?' selected':'')+'>租赁单</option><option value="CoachSchedule"'+(f.entityType==='CoachSchedule'?' selected':'')+'>教练排班</option><option value="RescueRecord"'+(f.entityType==='RescueRecord'?' selected':'')+'>救援记录</option><option value="DepositVerification"'+(f.entityType==='DepositVerification'?' selected':'')+'>押金核验</option></select><input placeholder="实体ID" id="f-a-entityId" value="'+(f.entityId||'')+'"><input placeholder="操作人" id="f-a-operatorName" value="'+(f.operatorName||'')+'"><input placeholder="动作" id="f-a-action" value="'+(f.action||'')+'"><button class="btn btn-primary btn-sm" onclick="filterAudit()">筛选</button><button class="btn btn-ghost btn-sm" onclick="curFilter.audit={};curPage.audit=1;loadAudit()">清除</button></div>';
  if(!data.items.length){h+='<div class="empty-state"><div class="icon">📋</div><p>暂无操作记录</p></div>';pg.innerHTML=h;return;}
  h+='<table><thead><tr><th>时间</th><th>实体类型</th><th>实体ID</th><th>动作</th><th>原状态</th><th>新状态</th><th>操作人</th><th>备注</th></tr></thead><tbody>';
  data.items.forEach(i=>{const sid=i.entityId.substring(0,8)+'…';h+='<tr><td>'+fdf(i.createdAt)+'</td><td>'+(TL[i.entityType]||i.entityType)+'</td><td><span class="link-badge" onclick="navigateToEntity(\''+i.entityType+'\',\''+i.entityId+'\')">'+sid+'</span></td><td>'+i.action+'</td><td>'+(sl(i.fromStatus)||'—')+'</td><td>'+sl(i.toStatus)+'</td><td>'+i.operatorName+'</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+(i.notes||'')+'">'+(i.notes||'-')+'</td></tr>';});
  h+='</tbody></table>'+pagHtml(data.page,data.totalPages,data.total);pg.innerHTML=h;
}
function filterAudit(){curFilter.audit={entityType:document.getElementById('f-a-entityType').value,entityId:document.getElementById('f-a-entityId').value,operatorName:document.getElementById('f-a-operatorName').value,action:document.getElementById('f-a-action').value};curPage.audit=1;loadAudit();}

function navigateToEntity(type,id){
  closeModal();
  if(type==='RentalOrder')showRentalDetail(id);
  else if(type==='CoachSchedule')showCoachDetail(id);
  else if(type==='RescueRecord')showRescueDetail(id);
  else if(type==='DepositVerification')showDepositDetail(id);
}

loadPage();
</script>
</body>
</html>
