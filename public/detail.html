<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>稿件详情 - 稿件接收与报价评估</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #f5f7fa;
      color: #333;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    .back-header {
      margin-bottom: 24px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 16px;
      background: white;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .back-link:hover {
      background: #667eea;
      color: white;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 24px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 24px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f0f0f0;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: '';
      width: 4px;
      height: 20px;
      background: linear-gradient(180deg, #667eea, #764ba2);
      border-radius: 2px;
    }

    .manuscript-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .manuscript-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .manuscript-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #666;
    }

    .status-badge {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
    }

    .status-draft { background: #f5f5f5; color: #999; }
    .status-received { background: #fff3e0; color: #ff9800; }
    .status-assessing { background: #e3f2fd; color: #2196f3; }
    .status-quoted { background: #e1bee7; color: #9c27b0; }
    .status-approved { background: #c8e6c9; color: #4caf50; }
    .status-assigned { background: #b2dfdb; color: #00897b; }
    .status-translating { background: #d1ecf1; color: #17a2b8; }
    .status-translated { background: #ffe0b2; color: #ff5722; }
    .status-reviewing { background: #fce4ec; color: #e91e63; }
    .status-completed { background: #c5e1a5; color: #689f38; }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .info-item {
      padding: 16px;
      background: #f8f9ff;
      border-radius: 8px;
    }

    .info-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 6px;
    }

    .info-value {
      font-size: 16px;
      font-weight: 500;
      color: #333;
    }

    .context-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #f0f0f0;
    }

    .context-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .context-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .context-badges {
      display: flex;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    .badge-success {
      background: #e8f5e9;
      color: #4caf50;
    }

    .badge-warning {
      background: #fff3e0;
      color: #ff9800;
    }

    .badge-info {
      background: #e3f2fd;
      color: #2196f3;
    }

    .glossary-item, .feedback-item {
      padding: 16px;
      background: #f8f9ff;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .glossary-header, .feedback-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .glossary-name, .feedback-type {
      font-weight: 600;
      color: #333;
    }

    .glossary-meta, .feedback-summary {
      font-size: 13px;
      color: #666;
    }

    .terms-preview {
      margin-top: 12px;
      padding: 12px;
      background: white;
      border-radius: 6px;
      font-size: 13px;
    }

    .term-row {
      display: flex;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .term-row:last-child {
      border-bottom: none;
    }

    .term-lang {
      color: #667eea;
      font-weight: 500;
      width: 60px;
    }

    .term-value {
      color: #333;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f4ff;
      color: #667eea;
    }

    .btn-secondary:hover {
      background: #667eea;
      color: white;
    }

    .btn-success {
      background: #4caf50;
      color: white;
    }

    .btn-success:hover {
      background: #45a049;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .assessment-form {
      display: none;
    }

    .assessment-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e8ecf1;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: #667eea;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .price-preview {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .price-row:last-child {
      margin-bottom: 0;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.3);
    }

    .price-label {
      font-size: 14px;
      opacity: 0.9;
    }

    .price-value {
      font-size: 18px;
      font-weight: 600;
    }

    .price-total {
      font-size: 24px;
    }

    .pending-items {
      background: #fff3e0;
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
    }

    .pending-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      font-size: 14px;
    }

    .pending-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ff9800;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .history-timeline {
      max-height: 600px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .history-content {
      flex: 1;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .history-operator {
      font-weight: 600;
      color: #333;
    }

    .history-role {
      font-size: 12px;
      color: #999;
      margin-left: 8px;
    }

    .history-time {
      font-size: 12px;
      color: #999;
    }

    .history-action {
      color: #667eea;
      font-weight: 500;
    }

    .history-notes {
      font-size: 14px;
      color: #666;
      margin-top: 4px;
      line-height: 1.6;
    }

    .history-context {
      margin-top: 12px;
      padding: 12px;
      background: #f8f9ff;
      border-radius: 8px;
      font-size: 13px;
    }

    .context-tag {
      display: inline-block;
      padding: 4px 10px;
      background: white;
      border-radius: 4px;
      margin: 4px 4px 4px 0;
      color: #667eea;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 32px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 600;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #f0f0f0;
      cursor: pointer;
      font-size: 18px;
      color: #666;
    }

    .modal-close:hover {
      background: #e0e0e0;
    }

    @media (max-width: 1200px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="back-header">
      <a href="index.html" class="back-link">← 返回今日待办</a>
    </div>

    <div class="main-grid">
      <div class="main-content">
        <div class="card" id="manuscriptCard">
          <div class="manuscript-header">
            <div>
              <h1 class="manuscript-title" id="manuscriptTitle">加载中...</h1>
              <div class="manuscript-meta" id="manuscriptMeta"></div>
            </div>
            <span class="status-badge" id="statusBadge">状态</span>
          </div>

          <div class="info-grid" id="infoGrid"></div>

          <div class="context-section">
            <div class="context-header">
              <h3 class="context-title">📎 上下文交接</h3>
              <div class="context-badges" id="contextBadges"></div>
            </div>

            <div id="glossarySection" style="display: none;">
              <h4 style="font-size: 14px; margin-bottom: 12px; color: #666;">术语表</h4>
              <div id="glossaryContent"></div>
            </div>

            <div id="feedbackSection" style="display: none; margin-top: 16px;">
              <h4 style="font-size: 14px; margin-bottom: 12px; color: #666;">客户反馈</h4>
              <div id="feedbackContent"></div>
            </div>

            <div id="pendingItemsSection" style="display: none;">
              <div class="pending-items">
                <h4 style="font-size: 14px; margin-bottom: 12px;">⚠️ 待完善事项</h4>
                <div id="pendingItemsContent"></div>
              </div>
            </div>

            <div class="action-buttons" id="actionButtons"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">💰 报价评估</h3>
          </div>

          <div id="quoteSection"></div>

          <div id="assessmentForm" class="assessment-form">
            <div class="form-group">
              <label class="form-label">基础单价（元/字）</label>
              <input type="number" class="form-input" id="basePrice" step="0.01" min="0" placeholder="例如：0.12">
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label">折扣（%）</label>
                <input type="number" class="form-input" id="discount" min="0" max="100" value="0">
              </div>
              <div class="form-group">
                <label class="form-label">交付周期（天）</label>
                <input type="number" class="form-input" id="deliveryDays" min="1" placeholder="例如：5">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">评估备注</label>
              <textarea class="form-input" id="assessmentNotes" rows="3" placeholder="说明报价依据、注意事项等"></textarea>
            </div>

            <div class="price-preview" id="pricePreview" style="display: none;">
              <div class="price-row">
                <span class="price-label">字数</span>
                <span class="price-value" id="wordCountDisplay">0</span>
              </div>
              <div class="price-row">
                <span class="price-label">单价</span>
                <span class="price-value" id="unitPriceDisplay">¥0.00</span>
              </div>
              <div class="price-row">
                <span class="price-label">小计</span>
                <span class="price-value" id="subtotalDisplay">¥0.00</span>
              </div>
              <div class="price-row">
                <span class="price-label">折扣</span>
                <span class="price-value" id="discountDisplay">-¥0.00</span>
              </div>
              <div class="price-row">
                <span class="price-label">最终报价</span>
                <span class="price-value price-total" id="finalPriceDisplay">¥0.00</span>
              </div>
            </div>

            <div class="action-buttons">
              <button class="btn btn-primary" id="submitAssessment" onclick="submitAssessment()">提交报价</button>
              <button class="btn btn-secondary" onclick="hideAssessmentForm()">取消</button>
            </div>
          </div>
        </div>
      </div>

      <div class="sidebar">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">📜 操作历史</h3>
          </div>
          <div class="history-timeline" id="historyTimeline"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="receiveModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">📥 接收稿件</h3>
        <button class="modal-close" onclick="closeModal('receiveModal')">×</button>
      </div>
      <div class="form-group">
        <label class="form-label">接收备注</label>
        <textarea class="form-input" id="receiveNotes" rows="3" placeholder="记录接收时的情况、注意事项等"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">关联术语表</label>
        <select class="form-input" id="glossarySelect">
          <option value="">选择术语表（可选）</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">关联客户反馈</label>
        <div id="feedbackCheckboxes"></div>
      </div>
      <div class="action-buttons">
        <button class="btn btn-primary" onclick="confirmReceive()">确认接收</button>
        <button class="btn btn-secondary" onclick="closeModal('receiveModal')">取消</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';
    let currentManuscript = null;
    let currentQuote = null;
    let allGlossaries = [];
    let allFeedbacks = [];
    let selectedGlossary = null;
    let selectedFeedbacks = [];

    const actionIcons = {
      receive: '📥',
      connect_glossary: '📚',
      connect_feedback: '💬',
      start_assessment: '📊',
      assess_quote: '💰',
      submit_quote: '📤',
      approve_quote: '✅',
      reject_quote: '❌',
      assign_translator: '👤',
      assign_reviewer: '🔍',
      start_translation: '✍️',
      complete_translation: '✅',
      start_review: '🔍',
      submit_review: '📋'
    };

    async function loadManuscript() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        alert('缺少稿件ID');
        window.location.href = 'index.html';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/manuscripts/${id}`);
        const data = await response.json();

        currentManuscript = data.manuscript;
        currentQuote = data.quote;

        await loadGlossaries();
        await loadFeedbacks();

        renderManuscript(data);
        renderQuote(data.quote);
        renderHistory(data.history);
      } catch (error) {
        console.error('加载失败:', error);
        alert('加载稿件失败');
      }
    }

    async function loadGlossaries() {
      try {
        const response = await fetch(`${API_BASE}/glossaries`);
        const data = await response.json();
        allGlossaries = data.glossaries;
      } catch (error) {
        console.error('加载术语表失败:', error);
      }
    }

    async function loadFeedbacks() {
      try {
        const response = await fetch(`${API_BASE}/client-feedbacks`);
        const data = await response.json();
        allFeedbacks = data.feedbacks;
      } catch (error) {
        console.error('加载客户反馈失败:', error);
      }
    }

    function renderManuscript(data) {
      const m = data.manuscript;

      document.getElementById('manuscriptTitle').textContent = m.title;

      document.getElementById('manuscriptMeta').innerHTML = `
        <div class="meta-item">🏢 ${m.client}</div>
        <div class="meta-item">🌐 ${m.source_language} → ${m.target_language}</div>
        <div class="meta-item">📅 截止 ${m.deadline}</div>
      `;

      const statusClass = `status-${m.status}`;
      document.getElementById('statusBadge').className = `status-badge ${statusClass}`;
      document.getElementById('statusBadge').textContent = getStatusText(m.status);

      const urgencyMap = {
        urgent: { text: '🔥 紧急', class: 'urgency-urgent' },
        normal: { text: '📋 普通', class: 'urgency-normal' },
        low: { text: '⏰ 宽松', class: 'urgency-low' }
      };
      const urgency = urgencyMap[m.urgency] || { text: '', class: '' };

      document.getElementById('infoGrid').innerHTML = `
        <div class="info-item">
          <div class="info-label">稿件编号</div>
          <div class="info-value">${m.id}</div>
        </div>
        <div class="info-item">
          <div class="info-label">客户</div>
          <div class="info-value">${m.client}</div>
        </div>
        <div class="info-item">
          <div class="info-label">字数</div>
          <div class="info-value">${m.word_count.toLocaleString()} 字</div>
        </div>
        <div class="info-item">
          <div class="info-label">紧急程度</div>
          <div class="info-value"><span class="urgency-badge ${urgency.class}">${urgency.text}</span></div>
        </div>
        <div class="info-item">
          <div class="info-label">截止日期</div>
          <div class="info-value">${m.deadline}</div>
        </div>
        <div class="info-item">
          <div class="info-label">当前处理人</div>
          <div class="info-value">${m.current_handler_role} - ${m[currentHandlerField(m)] || '待分配'}</div>
        </div>
        ${m.received_at ? `
        <div class="info-item">
          <div class="info-label">接收时间</div>
          <div class="info-value">${formatDateTime(m.received_at)}</div>
        </div>
        ` : ''}
        ${m.received_by ? `
        <div class="info-item">
          <div class="info-label">接收人</div>
          <div class="info-value">${m.received_by}</div>
        </div>
        ` : ''}
      `;

      renderContextSection(m);
      renderActionButtons(m);
    }

    function currentHandlerField(m) {
      if (m.status === 'translating' && m.translator_name) return 'translator_name';
      if (m.status === 'reviewing' && m.reviewer_name) return 'reviewer_name';
      return 'current_handler_role';
    }

    function renderContextSection(m) {
      const badges = [];
      badges.push(`<span class="badge ${m.terms_connected ? 'badge-success' : 'badge-warning'}">
        ${m.terms_connected ? '✓' : '⚠️'} 术语表 ${m.terms_connected ? '已关联' : '未关联'}
      </span>`);
      badges.push(`<span class="badge ${m.feedback_connected ? 'badge-success' : 'badge-warning'}">
        ${m.feedback_connected ? '✓' : '⚠️'} 客户反馈 ${m.feedback_connected ? '已关联' : '未关联'}
      </span>`);
      if (m.quote_id) {
        badges.push(`<span class="badge badge-info">✓ 已有报价</span>`);
      }

      document.getElementById('contextBadges').innerHTML = badges.join('');

      if (m.terms_connected && data.glossary) {
        document.getElementById('glossarySection').style.display = 'block';
        const g = data.glossary;
        document.getElementById('glossaryContent').innerHTML = `
          <div class="glossary-item">
            <div class="glossary-header">
              <span class="glossary-name">${g.client_name} - 术语表 ${g.version}</span>
              <span class="badge badge-success">${g.term_count} 条术语</span>
            </div>
            <div class="glossary-meta">最后更新: ${g.last_updated}</div>
            <div class="terms-preview">
              <div style="font-size: 12px; color: #999; margin-bottom: 8px;">术语预览：</div>
              ${g.terms_sample.slice(0, 5).map(t => `
                <div class="term-row">
                  <span class="term-lang">${t.zh ? '中文' : '源'}</span>
                  <span class="term-value">${t.zh || t.en}</span>
                  <span class="term-lang">${t.en ? '英文' : '目标'}</span>
                  <span class="term-value">${t.en || t.zh}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (m.feedback_connected && data.feedbacks && data.feedbacks.length > 0) {
        document.getElementById('feedbackSection').style.display = 'block';
        document.getElementById('feedbackContent').innerHTML = data.feedbacks.map(f => `
          <div class="feedback-item">
            <div class="feedback-header">
              <span class="feedback-type">${f.type === 'style_preference' ? '💅 风格偏好' : '📝 质量反馈'}</span>
              <span style="font-size: 12px; color: #999;">${f.created_at}</span>
            </div>
            <div class="feedback-summary">${f.summary}</div>
          </div>
        `).join('');
      }
    }

    function renderActionButtons(m) {
      const buttons = [];

      if (m.status === 'draft') {
        buttons.push(`
          <button class="btn btn-primary" onclick="openReceiveModal()">
            📥 接收稿件
          </button>
        `);
      }

      if (m.status === 'received' && !m.quote_id) {
        buttons.push(`
          <button class="btn btn-primary" onclick="startAssessment()">
            📊 开始报价评估
          </button>
        `);
      }

      if (m.status === 'assessing' && m.quote_status === 'pending_assessment') {
        buttons.push(`
          <button class="btn btn-primary" onclick="showAssessmentForm()">
            💰 继续评估
          </button>
        `);
      }

      if (m.quote_status === 'assessing' && currentQuote && currentQuote.final_price !== null) {
        buttons.push(`
          <button class="btn btn-success" onclick="submitQuote()">
            📤 提交报价
          </button>
        `);
      }

      document.getElementById('actionButtons').innerHTML = buttons.join('');
    }

    function renderQuote(quote) {
      const container = document.getElementById('quoteSection');

      if (!quote) {
        container.innerHTML = `
          <div style="text-align: center; padding: 40px; color: #999;">
            <div style="font-size: 48px; margin-bottom: 16px;">📋</div>
            <div>暂无报价信息</div>
          </div>
        `;
        return;
      }

      let html = `
        <div style="margin-bottom: 20px;">
          <span class="badge ${quote.status === 'approved' ? 'badge-success' : 'badge-warning'}">
            ${quote.status === 'approved' ? '✅ 已批准' : quote.status === 'quoted' ? '📤 已提交' : '⏳ 评估中'}
          </span>
        </div>
      `;

      if (quote.final_price !== null) {
        html += `
          <div class="price-preview">
            <div class="price-row">
              <span class="price-label">字数</span>
              <span class="price-value">${currentManuscript.word_count.toLocaleString()} 字</span>
            </div>
            <div class="price-row">
              <span class="price-label">基础单价</span>
              <span class="price-value">¥${quote.base_price}/字</span>
            </div>
            <div class="price-row">
              <span class="price-label">小计</span>
              <span class="price-value">¥${quote.calculated_price.toFixed(2)}</span>
            </div>
            ${quote.discount > 0 ? `
            <div class="price-row">
              <span class="price-label">折扣 (${quote.discount}%)</span>
              <span class="price-value">-¥${(quote.calculated_price * quote.discount / 100).toFixed(2)}</span>
            </div>
            ` : ''}
            <div class="price-row">
              <span class="price-label">最终报价</span>
              <span class="price-value price-total">¥${quote.final_price.toFixed(2)}</span>
            </div>
          </div>
        `;
      }

      if (quote.assessment_notes) {
        html += `
          <div style="padding: 16px; background: #f8f9ff; border-radius: 8px; margin-bottom: 16px;">
            <div style="font-size: 12px; color: #999; margin-bottom: 4px;">评估备注</div>
            <div style="font-size: 14px; color: #333;">${quote.assessment_notes}</div>
          </div>
        `;
      }

      if (quote.pending_items && quote.pending_items.length > 0) {
        html += `
          <div class="pending-items">
            <h4 style="font-size: 14px; margin-bottom: 12px;">⚠️ 待完善事项</h4>
            ${quote.pending_items.map(item => `
              <div class="pending-item">
                <span class="pending-icon">!</span>
                <span>${item.item}: ${item.message}</span>
              </div>
            `).join('')}
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function renderHistory(history) {
      const container = document.getElementById('historyTimeline');

      if (!history || history.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">暂无历史记录</div>';
        return;
      }

      container.innerHTML = history.map(item => {
        const actionText = {
          receive: '接收稿件',
          connect_glossary: '关联术语表',
          connect_feedback: '关联客户反馈',
          start_assessment: '开始报价评估',
          assess_quote: '完成报价评估',
          submit_quote: '提交报价',
          approve_quote: '客户确认报价',
          reject_quote: '客户拒绝报价',
          assign_translator: '分配译员',
          assign_reviewer: '分配审校',
          start_translation: '开始翻译',
          complete_translation: '完成翻译',
          start_review: '开始审校',
          submit_review: '提交审校'
        };

        return `
          <div class="history-item">
            <div class="history-icon">${actionIcons[item.action] || '📋'}</div>
            <div class="history-content">
              <div class="history-header">
                <div>
                  <span class="history-operator">${item.operator_name}</span>
                  <span class="history-role">${item.operator_role}</span>
                </div>
                <span class="history-time">${formatDateTime(item.created_at)}</span>
              </div>
              <div class="history-action">${actionText[item.action] || item.action}</div>
              ${item.notes ? `<div class="history-notes">${item.notes}</div>` : ''}
              ${item.context_passed && Object.keys(item.context_passed).length > 0 ? `
                <div class="history-context">
                  ${Object.entries(item.context_passed).map(([key, value]) => `
                    <span class="context-tag">${formatContextKey(key)}: ${formatContextValue(value)}</span>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function formatContextKey(key) {
      const keyMap = {
        from_module: '来自模块',
        to_module: '目标模块',
        has_glossary: '术语表',
        has_feedback: '客户反馈',
        glossary_id: '术语表ID',
        glossary_version: '版本',
        term_count: '术语数',
        feedback_ids: '反馈ID',
        context_summary: '上下文摘要',
        final_price: '最终报价',
        delivery_days: '交付周期',
        quote_id: '报价单ID'
      };
      return keyMap[key] || key;
    }

    function formatContextValue(value) {
      if (typeof value === 'boolean') {
        return value ? '✓' : '✗';
      }
      if (typeof value === 'number') {
        return value;
      }
      if (typeof value === 'string') {
        return value;
      }
      return JSON.stringify(value);
    }

    function openReceiveModal() {
      const glossarySelect = document.getElementById('glossarySelect');
      glossarySelect.innerHTML = `
        <option value="">选择术语表（可选）</option>
        ${allGlossaries.filter(g => g.client_id === currentManuscript.client_id).map(g => `
          <option value="${g.id}">${g.client_name} - ${g.version} (${g.term_count}条)</option>
        `).join('')}
      `;

      const feedbackCheckboxes = document.getElementById('feedbackCheckboxes');
      feedbackCheckboxes.innerHTML = allFeedbacks
        .filter(f => f.client_id === currentManuscript.client_id)
        .map(f => `
          <label style="display: block; padding: 8px; cursor: pointer;">
            <input type="checkbox" value="${f.id}" onchange="toggleFeedback('${f.id}')">
            <span style="margin-left: 8px;">${f.summary}</span>
          </label>
        `).join('') || '<div style="color: #999; padding: 8px;">暂无客户反馈</div>';

      document.getElementById('receiveModal').classList.add('active');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    async function confirmReceive() {
      const notes = document.getElementById('receiveNotes').value;
      const glossaryId = document.getElementById('glossarySelect').value;

      try {
        const response = await fetch(`${API_BASE}/manuscripts/${currentManuscript.id}/receive`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            operator_id: 'U001',
            notes,
            glossary_id: glossaryId || null,
            client_feedback_ids: selectedFeedbacks
          })
        });

        const result = await response.json();

        if (result.success) {
          alert('稿件接收成功！');
          closeModal('receiveModal');
          await loadManuscript();
        } else {
          alert('接收失败: ' + result.error);
        }
      } catch (error) {
        console.error('接收失败:', error);
        alert('接收失败，请重试');
      }
    }

    function toggleFeedback(feedbackId) {
      const index = selectedFeedbacks.indexOf(feedbackId);
      if (index > -1) {
        selectedFeedbacks.splice(index, 1);
      } else {
        selectedFeedbacks.push(feedbackId);
      }
    }

    async function startAssessment() {
      try {
        const response = await fetch(`${API_BASE}/manuscripts/${currentManuscript.id}/start-assessment`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            operator_id: 'U001',
            notes: '开始报价评估'
          })
        });

        const result = await response.json();

        if (result.success) {
          currentQuote = result.quote;
          currentManuscript = result.manuscript;
          await loadManuscript();
          showAssessmentForm();
        } else {
          alert('启动评估失败: ' + result.error);
        }
      } catch (error) {
        console.error('启动评估失败:', error);
        alert('启动评估失败，请重试');
      }
    }

    function showAssessmentForm() {
      document.getElementById('assessmentForm').classList.add('active');
      updatePricePreview();
    }

    function hideAssessmentForm() {
      document.getElementById('assessmentForm').classList.remove('active');
    }

    function updatePricePreview() {
      const basePrice = parseFloat(document.getElementById('basePrice').value) || 0;
      const discount = parseFloat(document.getElementById('discount').value) || 0;

      const wordCount = currentManuscript.word_count;
      const subtotal = wordCount * basePrice;
      const discountAmount = subtotal * discount / 100;
      const finalPrice = subtotal - discountAmount;

      document.getElementById('wordCountDisplay').textContent = `${wordCount.toLocaleString()} 字`;
      document.getElementById('unitPriceDisplay').textContent = `¥${basePrice.toFixed(2)}/字`;
      document.getElementById('subtotalDisplay').textContent = `¥${subtotal.toFixed(2)}`;
      document.getElementById('discountDisplay').textContent = `-¥${discountAmount.toFixed(2)}`;
      document.getElementById('finalPriceDisplay').textContent = `¥${finalPrice.toFixed(2)}`;

      document.getElementById('pricePreview').style.display = 'block';
    }

    document.getElementById('basePrice').addEventListener('input', updatePricePreview);
    document.getElementById('discount').addEventListener('input', updatePricePreview);

    async function submitAssessment() {
      const basePrice = parseFloat(document.getElementById('basePrice').value);
      const discount = parseFloat(document.getElementById('discount').value) || 0;
      const deliveryDays = parseInt(document.getElementById('deliveryDays').value);
      const assessmentNotes = document.getElementById('assessmentNotes').value;

      if (!basePrice || basePrice <= 0) {
        alert('请输入有效的单价');
        return;
      }

      if (!deliveryDays || deliveryDays <= 0) {
        alert('请输入有效的交付周期');
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/quotes/${currentQuote.id}/assess`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            operator_id: 'U001',
            base_price: basePrice,
            final_price: currentManuscript.word_count * basePrice * (1 - discount / 100),
            discount,
            delivery_days: deliveryDays,
            assessment_notes: assessmentNotes
          })
        });

        const result = await response.json();

        if (result.success) {
          currentQuote = result.quote;
          currentManuscript = result.manuscript;
          await loadManuscript();
          alert('报价评估完成！可以提交报价了。');
        } else {
          alert('评估失败: ' + result.error);
        }
      } catch (error) {
        console.error('评估失败:', error);
        alert('评估失败，请重试');
      }
    }

    async function submitQuote() {
      try {
        const response = await fetch(`${API_BASE}/quotes/${currentQuote.id}/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            operator_id: 'U001',
            notes: '报价已提交，等待客户确认'
          })
        });

        const result = await response.json();

        if (result.success) {
          currentQuote = result.quote;
          currentManuscript = result.manuscript;
          await loadManuscript();
          alert('报价提交成功！');
        } else {
          alert('提交失败: ' + result.error);
        }
      } catch (error) {
        console.error('提交失败:', error);
        alert('提交失败，请重试');
      }
    }

    function getStatusText(status) {
      const statusMap = {
        draft: '草稿',
        received: '已接收',
        assessing: '评估中',
        quoted: '已报价',
        approved: '已批准',
        assigned: '已分配',
        translating: '翻译中',
        translated: '已翻译',
        reviewing: '审校中',
        completed: '已完成'
      };
      return statusMap[status] || status;
    }

    function formatDateTime(timestamp) {
      if (!timestamp) return '-';
      const date = new Date(timestamp);
      return date.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    let data = {};

    window.addEventListener('DOMContentLoaded', async () => {
      await loadManuscript();
    });

    async function loadManuscript() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        alert('缺少稿件ID');
        window.location.href = 'index.html';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/manuscripts/${id}`);
        data = await response.json();

        currentManuscript = data.manuscript;
        currentQuote = data.quote;

        await loadGlossaries();
        await loadFeedbacks();

        renderManuscript(data);
        renderQuote(data.quote);
        renderHistory(data.history);
      } catch (error) {
        console.error('加载失败:', error);
        alert('加载稿件失败');
      }
    }
  </script>
</body>
</html>
