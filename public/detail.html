<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>稿件详情 - 稿件接收与报价评估</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #f5f7fa;
      color: #333;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    .back-header {
      margin-bottom: 24px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 16px;
      background: white;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .back-link:hover {
      background: #667eea;
      color: white;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 24px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 24px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f0f0f0;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: '';
      width: 4px;
      height: 20px;
      background: linear-gradient(180deg, #667eea, #764ba2);
      border-radius: 2px;
    }

    .manuscript-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .manuscript-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .manuscript-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #666;
    }

    .status-badge {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
    }

    .status-draft { background: #f5f5f5; color: #999; }
    .status-received { background: #fff3e0; color: #ff9800; }
    .status-assessing { background: #e3f2fd; color: #2196f3; }
    .status-quoted { background: #e1bee7; color: #9c27b0; }
    .status-approved { background: #c8e6c9; color: #4caf50; }
    .status-assigned { background: #b2dfdb; color: #00897b; }
    .status-translating { background: #d1ecf1; color: #17a2b8; }
    .status-translated { background: #ffe0b2; color: #ff5722; }
    .status-reviewing { background: #fce4ec; color: #e91e63; }
    .status-completed { background: #c5e1a5; color: #689f38; }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .info-item {
      padding: 16px;
      background: #f8f9ff;
      border-radius: 8px;
    }

    .info-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 6px;
    }

    .info-value {
      font-size: 16px;
      font-weight: 500;
      color: #333;
    }

    .context-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #f0f0f0;
    }

    .context-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .context-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .context-badges {
      display: flex;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    .badge-success {
      background: #e8f5e9;
      color: #4caf50;
    }

    .badge-warning {
      background: #fff3e0;
      color: #ff9800;
    }

    .badge-info {
      background: #e3f2fd;
      color: #2196f3;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-success {
      background: #4caf50;
      color: white;
    }

    .btn-secondary {
      background: #f0f4ff;
      color: #667eea;
    }

    .btn-secondary:hover {
      background: #667eea;
      color: white;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .assessment-form, .assign-form {
      display: none;
    }

    .assessment-form.active, .assign-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e8ecf1;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: #667eea;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .form-select {
      width: 100%;
      padding: 12px;
      border: 1px solid #e8ecf1;
      border-radius: 8px;
      font-size: 14px;
      background: white;
    }

    .form-select:focus {
      outline: none;
      border-color: #667eea;
    }

    .price-preview {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .price-row:last-child {
      margin-bottom: 0;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.3);
    }

    .price-label {
      font-size: 14px;
      opacity: 0.9;
    }

    .price-value {
      font-size: 18px;
      font-weight: 600;
    }

    .price-total {
      font-size: 24px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
      margin: 8px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 4px;
    }

    .history-timeline {
      max-height: 600px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .history-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .history-content {
      flex: 1;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .history-operator {
      font-weight: 600;
      color: #333;
    }

    .history-role {
      font-size: 12px;
      color: #999;
      margin-left: 8px;
    }

    .history-time {
      font-size: 12px;
      color: #999;
    }

    .history-action {
      color: #667eea;
      font-weight: 500;
    }

    .history-notes {
      font-size: 14px;
      color: #666;
      margin-top: 4px;
    }

    .history-context {
      margin-top: 12px;
      padding: 12px;
      background: #f8f9ff;
      border-radius: 8px;
      font-size: 13px;
    }

    .context-tag {
      display: inline-block;
      padding: 4px 10px;
      background: white;
      border-radius: 4px;
      margin: 4px 4px 4px 0;
      color: #667eea;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 32px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 600;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #f0f0f0;
      cursor: pointer;
      font-size: 18px;
      color: #666;
    }

    .urgency-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      margin-left: 8px;
    }

    .urgency-urgent {
      background: #ffebee;
      color: #f44336;
    }

    .urgency-normal {
      background: #e3f2fd;
      color: #2196f3;
    }

    @media (max-width: 1200px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="back-header">
      <a href="index.html" class="back-link">← 返回今日待办</a>
    </div>

    <div class="main-grid">
      <div class="main-content">
        <div class="card" id="manuscriptCard">
          <div class="manuscript-header">
            <div>
              <h1 class="manuscript-title" id="manuscriptTitle">加载中...</h1>
              <div class="manuscript-meta" id="manuscriptMeta"></div>
            </div>
            <span class="status-badge" id="statusBadge">状态</span>
          </div>

          <div class="info-grid" id="infoGrid"></div>

          <div class="context-section">
            <div class="context-header">
              <h3 class="context-title">📎 上下文交接</h3>
              <div class="context-badges" id="contextBadges"></div>
            </div>
            <div id="glossarySection" style="margin-bottom: 16px;"></div>
            <div id="feedbackSection"></div>
            <div class="action-buttons" id="actionButtons"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">💰 报价评估</h3>
          </div>
          <div id="quoteSection"></div>
          <div id="assessmentForm" class="assessment-form">
            <div class="form-group">
              <label class="form-label">基础单价（元/字）</label>
              <input type="number" class="form-input" id="basePrice" step="0.01" min="0">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">折扣（%）</label>
                <input type="number" class="form-input" id="discount" min="0" max="100" value="0">
              </div>
              <div class="form-group">
                <label class="form-label">交付周期（天）</label>
                <input type="number" class="form-input" id="deliveryDays" min="1">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">评估备注</label>
              <textarea class="form-input" id="assessmentNotes" rows="3"></textarea>
            </div>
            <div class="price-preview" id="pricePreview">
              <div class="price-row"><span class="price-label">字数</span><span class="price-value" id="wordCountDisplay">0</span></div>
              <div class="price-row"><span class="price-label">单价</span><span class="price-value" id="unitPriceDisplay">¥0.00</span></div>
              <div class="price-row"><span class="price-label">小计</span><span class="price-value" id="subtotalDisplay">¥0.00</span></div>
              <div class="price-row"><span class="price-label">折扣</span><span class="price-value" id="discountDisplay">-¥0.00</span></div>
              <div class="price-row"><span class="price-label">最终报价</span><span class="price-value price-total" id="finalPriceDisplay">¥0.00</span></div>
            </div>
            <div class="action-buttons">
              <button class="btn btn-primary" onclick="submitAssessment()">提交报价</button>
              <button class="btn btn-secondary" onclick="hideAssessmentForm()">取消</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">👥 分配管理</h3>
          </div>
          <div id="assignmentSection"></div>
          <div id="assignTranslatorForm" class="assign-form">
            <div class="form-group">
              <label class="form-label">选择译员</label>
              <select class="form-select" id="translatorSelect"></select>
            </div>
            <div class="form-group">
              <label class="form-label">截止日期</label>
              <input type="date" class="form-input" id="dueDate">
            </div>
            <div class="action-buttons">
              <button class="btn btn-success" onclick="assignTranslator()">确认分配</button>
              <button class="btn btn-secondary" onclick="hideAssignTranslatorForm()">取消</button>
            </div>
          </div>
          <div id="assignReviewerForm" class="assign-form">
            <div class="form-group">
              <label class="form-label">选择审校</label>
              <select class="form-select" id="reviewerSelect"></select>
            </div>
            <div class="action-buttons">
              <button class="btn btn-success" onclick="assignReviewer()">确认分配</button>
              <button class="btn btn-secondary" onclick="hideAssignReviewerForm()">取消</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">✍️ 翻译进度</h3>
          </div>
          <div id="translationSection"></div>
          <div id="progressForm" class="assign-form">
            <div class="form-group">
              <label class="form-label">进度（%）</label>
              <input type="number" class="form-input" id="progressInput" min="0" max="100">
            </div>
            <div class="action-buttons">
              <button class="btn btn-primary" onclick="updateProgress()">更新进度</button>
              <button class="btn btn-success" onclick="submitTranslation()">提交翻译</button>
              <button class="btn btn-secondary" onclick="hideProgressForm()">取消</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">🔍 审校进度</h3>
          </div>
          <div id="reviewSection"></div>
          <div id="reviewForm" class="assign-form">
            <div class="form-group">
              <label class="form-label">审校进度（%）</label>
              <input type="number" class="form-input" id="reviewProgressInput" min="0" max="100">
            </div>
            <div class="form-group">
              <label class="form-label">审校备注</label>
              <textarea class="form-input" id="reviewNotes" rows="3"></textarea>
            </div>
            <div class="action-buttons">
              <button class="btn btn-primary" onclick="updateReviewProgress()">更新进度</button>
              <button class="btn btn-success" onclick="submitReview()">完成审校</button>
              <button class="btn btn-secondary" onclick="hideReviewForm()">取消</button>
            </div>
          </div>
        </div>
      </div>

      <div class="sidebar">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">📜 操作历史</h3>
          </div>
          <div class="history-timeline" id="historyTimeline"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="approveQuoteModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">✅ 客户确认报价</h3>
        <button class="modal-close" onclick="closeModal('approveQuoteModal')">×</button>
      </div>
      <div class="form-group">
        <label class="form-label">确认备注</label>
        <textarea class="form-input" id="approveNotes" rows="3"></textarea>
      </div>
      <div class="action-buttons">
        <button class="btn btn-success" onclick="approveQuote()">确认报价</button>
        <button class="btn btn-secondary" onclick="closeModal('approveQuoteModal')">取消</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';
    let currentManuscript = null;
    let currentQuote = null;
    let currentGlossary = null;
    let currentFeedbacks = [];
    let allUsers = [];
    let data = {};

    const actionIcons = {
      receive: '📥', connect_glossary: '📚', connect_feedback: '💬',
      start_assessment: '📊', assess_quote: '💰', submit_quote: '📤',
      approve_quote: '✅', assign_translator: '👤', start_translation: '✍️',
      update_progress: '📈', submit_translation: '✅', assign_reviewer: '🔍',
      update_review_progress: '🔍', submit_review: '🏁'
    };

    async function loadManuscript() {
      const id = new URLSearchParams(window.location.search).get('id');
      if (!id) { alert('缺少稿件ID'); window.location.href = 'index.html'; return; }

      try {
        const [manuscriptRes, usersRes] = await Promise.all([
          fetch(`${API_BASE}/manuscripts/${id}`),
          fetch(`${API_BASE}/users`)
        ]);
        data = await manuscriptRes.json();
        allUsers = (await usersRes.json()).users;
        currentManuscript = data.manuscript;
        currentQuote = data.quote;
        currentGlossary = data.glossary;
        currentFeedbacks = data.feedbacks;

        renderManuscript();
        renderGlossary();
        renderFeedbacks();
        renderQuote();
        renderAssignmentSection();
        renderTranslationSection();
        renderReviewSection();
        renderHistory();
      } catch (error) {
        alert('加载稿件失败');
      }
    }

    function renderManuscript() {
      const m = currentManuscript;
      document.getElementById('manuscriptTitle').textContent = m.title;

      const urgencyMap = { urgent: { text: '🔥 紧急', class: 'urgency-urgent' }, normal: { text: '📋 普通', class: 'urgency-normal' } };
      const urgency = urgencyMap[m.urgency] || { text: '', class: '' };

      document.getElementById('manuscriptMeta').innerHTML = `
        <div class="meta-item">🏢 ${m.client}</div>
        <div class="meta-item">🌐 ${m.source_language} → ${m.target_language}</div>
        <div class="meta-item">📅 截止 ${m.deadline}</div>
        <span class="urgency-badge ${urgency.class}">${urgency.text}</span>
      `;

      document.getElementById('statusBadge').className = `status-badge status-${m.status}`;
      document.getElementById('statusBadge').textContent = getStatusText(m.status);

      let html = `
        <div class="info-item"><div class="info-label">稿件编号</div><div class="info-value">${m.id}</div></div>
        <div class="info-item"><div class="info-label">客户</div><div class="info-value">${m.client}</div></div>
        <div class="info-item"><div class="info-label">字数</div><div class="info-value">${m.word_count.toLocaleString()} 字</div></div>
        <div class="info-item"><div class="info-label">紧急程度</div><div class="info-value"><span class="urgency-badge ${urgency.class}">${urgency.text}</span></div></div>
        <div class="info-item"><div class="info-label">截止日期</div><div class="info-value">${m.deadline}</div></div>
        <div class="info-item"><div class="info-label">当前处理人</div><div class="info-value">${m.current_handler_role} - ${getCurrentHandlerName(m)}</div></div>
      `;

      if (m.translator_name) html += `<div class="info-item"><div class="info-label">译员</div><div class="info-value">${m.translator_name}</div></div>`;
      if (m.reviewer_name) html += `<div class="info-item"><div class="info-label">审校</div><div class="info-value">${m.reviewer_name}</div></div>`;
      if (m.due_date) html += `<div class="info-item"><div class="info-label">预计完成</div><div class="info-value">${m.due_date}</div></div>`;

      document.getElementById('infoGrid').innerHTML = html;
      renderContextBadges();
      renderActionButtons();
    }

    function getCurrentHandlerName(m) {
      if (m.status === 'translating' && m.translator_name) return m.translator_name;
      if (m.status === 'reviewing' && m.reviewer_name) return m.reviewer_name;
      return m.current_handler_role;
    }

    function getStatusText(status) {
      const map = { draft: '草稿', received: '已接收', assessing: '评估中', quoted: '待确认', approved: '已批准', assigned: '已分配', translating: '翻译中', translated: '待审校', reviewing: '审校中', completed: '已完成' };
      return map[status] || status;
    }

    function renderContextBadges() {
      const m = currentManuscript;
      const badges = [];
      badges.push(`<span class="badge ${m.terms_connected ? 'badge-success' : 'badge-warning'}">${m.terms_connected ? '✓' : '⚠️'} 术语表</span>`);
      badges.push(`<span class="badge ${m.feedback_connected ? 'badge-success' : 'badge-warning'}">${m.feedback_connected ? '✓' : '⚠️'} 客户反馈</span>`);
      if (m.quote_id) badges.push(`<span class="badge ${m.quote_status === 'approved' ? 'badge-success' : m.quote_status === 'quoted' ? 'badge-info' : 'badge-warning'}">${m.quote_status === 'approved' ? '✓' : '⏳'} 报价</span>`);
      document.getElementById('contextBadges').innerHTML = badges.join('');
    }

    function renderGlossary() {
      const container = document.getElementById('glossarySection');
      const glossary = currentGlossary;

      if (!glossary) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = `
        <div style="padding: 16px; background: #e8f5e9; border-radius: 8px; border-left: 4px solid #4caf50;">
          <div style="font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px;">
            <span>📚</span>关联术语表
          </div>
          <div style="font-size: 13px; color: #666; margin-bottom: 8px;">
            <div>客户：${glossary.client_name}</div>
            <div>版本：${glossary.version} | 术语数：${glossary.term_count}条 | 更新：${glossary.last_updated}</div>
          </div>
          ${glossary.terms_sample && glossary.terms_sample.length > 0 ? `
          <div style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed #c8e6c9;">
            <div style="font-size: 12px; color: #888; margin-bottom: 6px;">术语示例：</div>
            <div style="display: flex; flex-wrap: gap: 8px;">
              ${glossary.terms_sample.map(t => `
                <div style="display: inline-block; padding: 4px 10px; background: white; border-radius: 4px; margin-right: 8px; margin-bottom: 4px; font-size: 13px;">
                  <strong>${t.zh}</strong> → ${t.en}
                </div>
              `).join('')}
            </div>
          </div>
          ` : ''}
        </div>
      `;
    }

    function renderFeedbacks() {
      const container = document.getElementById('feedbackSection');
      const feedbacks = currentFeedbacks || [];

      if (!feedbacks || feedbacks.length === 0) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = `
        <div style="padding: 16px; background: #e3f2fd; border-radius: 8px; border-left: 4px solid #2196f3;">
          <div style="font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px;">
            <span>💬</span>客户反馈 (${feedbacks.length}条)
          </div>
          <div style="space-y: 8px;">
            ${feedbacks.map(f => `
              <div style="padding: 12px; background: white; border-radius: 6px; margin-bottom: 8px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                  <span style="font-weight: 500;">${f.type === 'style_preference' ? '风格偏好' : f.type === 'quality_feedback' ? '质量反馈' : f.type}</span>
                  <span style="font-size: 12px; color: #999;">${f.created_at}</span>
                </div>
                <div style="font-size: 13px; color: #666;">${f.summary}</div>
                ${f.detailed_notes ? `<div style="font-size: 12px; color: #888; margin-top: 4px; padding-top: 4px; border-top: 1px dashed #e8ecf1;">${f.detailed_notes}</div>` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderActionButtons() {
      const m = currentManuscript;
      const buttons = [];

      if (m.status === 'received' && !m.quote_id) buttons.push(`<button class="btn btn-primary" onclick="startAssessment()">📊 开始报价评估</button>`);
      if (m.status === 'assessing') buttons.push(`<button class="btn btn-primary" onclick="showAssessmentForm()">💰 继续评估</button>`);
      if (m.quote_status === 'assessing' && currentQuote?.final_price !== null) buttons.push(`<button class="btn btn-success" onclick="submitQuote()">📤 提交报价</button>`);
      if (m.status === 'quoted') buttons.push(`<button class="btn btn-success" onclick="openApproveQuoteModal()">✅ 客户确认报价</button>`);
      if (m.status === 'approved') buttons.push(`<button class="btn btn-primary" onclick="showAssignTranslatorForm()">👤 分配译员</button>`);
      if (m.status === 'assigned') buttons.push(`<button class="btn btn-primary" onclick="startTranslation()">✍️ 开始翻译</button>`);
      if (m.status === 'translating') buttons.push(`<button class="btn btn-primary" onclick="showProgressForm()">📈 更新进度</button>`);
      if (m.status === 'translated') buttons.push(`<button class="btn btn-primary" onclick="showAssignReviewerForm()">🔍 分配审校</button>`);
      if (m.status === 'reviewing') buttons.push(`<button class="btn btn-primary" onclick="showReviewForm()">📝 更新审校</button>`);

      document.getElementById('actionButtons').innerHTML = buttons.join('');
    }

    function renderQuote() {
      const quote = currentQuote;
      const container = document.getElementById('quoteSection');

      if (!quote) {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">暂无报价信息</div>';
        return;
      }

      let html = `<span class="badge ${quote.status === 'approved' ? 'badge-success' : quote.status === 'quoted' ? 'badge-info' : 'badge-warning'}">${quote.status === 'approved' ? '✅ 已批准' : quote.status === 'quoted' ? '📤 已提交' : '⏳ 评估中'}</span>`;

      if (quote.final_price !== null) {
        html += `
          <div class="price-preview">
            <div class="price-row"><span class="price-label">字数</span><span class="price-value">${currentManuscript.word_count.toLocaleString()} 字</span></div>
            <div class="price-row"><span class="price-label">单价</span><span class="price-value">¥${quote.base_price}/字</span></div>
            <div class="price-row"><span class="price-label">小计</span><span class="price-value">¥${quote.calculated_price.toFixed(2)}</span></div>
            ${quote.discount > 0 ? `<div class="price-row"><span class="price-label">折扣 (${quote.discount}%)</span><span class="price-value">-¥${(quote.calculated_price * quote.discount / 100).toFixed(2)}</span></div>` : ''}
            <div class="price-row"><span class="price-label">最终报价</span><span class="price-value price-total">¥${quote.final_price.toFixed(2)}</span></div>
          </div>
        `;
      }

      if (quote.assessment_notes) html += `<div style="padding: 16px; background: #f8f9ff; border-radius: 8px;"><div style="font-size: 12px; color: #999;">评估备注</div><div>${quote.assessment_notes}</div></div>`;
      container.innerHTML = html;
    }

    function renderAssignmentSection() {
      const m = currentManuscript;
      const container = document.getElementById('assignmentSection');

      if (m.status === 'completed') {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">任务已完成</div>';
        return;
      }

      let html = '';
      if (m.translator_name) html += `<div style="padding: 16px; background: #e3f2fd; border-radius: 8px;">译员：${m.translator_name}</div>`;
      if (m.reviewer_name) html += `<div style="padding: 16px; background: #fce4ec; border-radius: 8px; margin-top: 12px;">审校：${m.reviewer_name}</div>`;
      if (!m.translator_id && !m.reviewer_id) html += '<div style="text-align: center; padding: 40px; color: #999;">待分配人员</div>';

      container.innerHTML = html;
    }

    function renderTranslationSection() {
      const m = currentManuscript;
      const container = document.getElementById('translationSection');

      if (m.status === 'completed') {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">翻译已完成</div>';
        return;
      }

      if (!['assigned', 'translating', 'translated'].includes(m.status)) {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">等待分配译员</div>';
        return;
      }

      container.innerHTML = `
        <div style="margin-bottom: 16px;">
          <div style="display: flex; justify-content: space-between;"><span>翻译进度</span><span style="font-weight: 600;">${m.progress || 0}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width: ${m.progress || 0}%;"></div></div>
        </div>
        ${m.translator_name ? `<div style="padding: 12px; background: #f8f9ff; border-radius: 8px;">译员：${m.translator_name} ${m.due_date ? `| 截止：${m.due_date}` : ''}</div>` : ''}
      `;
    }

    function renderReviewSection() {
      const m = currentManuscript;
      const container = document.getElementById('reviewSection');

      if (m.status === 'completed') {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">审校已完成</div>';
        return;
      }

      if (!['translated', 'reviewing'].includes(m.status)) {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">等待翻译完成</div>';
        return;
      }

      container.innerHTML = `
        <div style="margin-bottom: 16px;">
          <div style="display: flex; justify-content: space-between;"><span>审校进度</span><span style="font-weight: 600;">${m.review_progress || 0}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width: ${m.review_progress || 0}%; background: linear-gradient(90deg, #e91e63, #f48fb1);"></div></div>
        </div>
        ${m.reviewer_name ? `<div style="padding: 12px; background: #fce4ec; border-radius: 8px;">审校：${m.reviewer_name}</div>` : ''}
        ${m.review_notes ? `<div style="padding: 12px; background: #fff3e0; border-radius: 8px; margin-top: 12px;">审校备注：${m.review_notes}</div>` : ''}
      `;
    }

    function renderHistory() {
      const history = data.history || [];
      const container = document.getElementById('historyTimeline');

      if (!history.length) {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">暂无历史记录</div>';
        return;
      }

      container.innerHTML = history.map(item => {
        const actionText = {
          receive: '接收稿件', connect_glossary: '关联术语表', connect_feedback: '关联客户反馈',
          start_assessment: '开始报价评估', assess_quote: '完成报价评估', submit_quote: '提交报价',
          approve_quote: '客户确认报价', assign_translator: '分配译员', start_translation: '开始翻译',
          update_progress: '更新翻译进度', submit_translation: '提交翻译', assign_reviewer: '分配审校',
          update_review_progress: '更新审校进度', submit_review: '完成审校'
        };

        return `
          <div class="history-item">
            <div class="history-icon">${actionIcons[item.action] || '📋'}</div>
            <div class="history-content">
              <div class="history-header">
                <div><span class="history-operator">${item.operator_name}</span><span class="history-role">${item.operator_role}</span></div>
                <span class="history-time">${formatDateTime(item.created_at)}</span>
              </div>
              <div class="history-action">${actionText[item.action] || item.action}</div>
              ${item.notes ? `<div class="history-notes">${item.notes}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function formatDateTime(timestamp) {
      return new Date(timestamp).toLocaleString('zh-CN');
    }

    function showAssessmentForm() {
      document.getElementById('assessmentForm').classList.add('active');
      updatePricePreview();
    }

    function hideAssessmentForm() {
      document.getElementById('assessmentForm').classList.remove('active');
    }

    function updatePricePreview() {
      const basePrice = parseFloat(document.getElementById('basePrice').value) || 0;
      const discount = parseFloat(document.getElementById('discount').value) || 0;
      const wordCount = currentManuscript.word_count;
      const subtotal = wordCount * basePrice;
      const discountAmount = subtotal * discount / 100;

      document.getElementById('wordCountDisplay').textContent = `${wordCount.toLocaleString()} 字`;
      document.getElementById('unitPriceDisplay').textContent = `¥${basePrice.toFixed(2)}/字`;
      document.getElementById('subtotalDisplay').textContent = `¥${subtotal.toFixed(2)}`;
      document.getElementById('discountDisplay').textContent = `-¥${discountAmount.toFixed(2)}`;
      document.getElementById('finalPriceDisplay').textContent = `¥${(subtotal - discountAmount).toFixed(2)}`;
    }

    document.getElementById('basePrice').addEventListener('input', updatePricePreview);
    document.getElementById('discount').addEventListener('input', updatePricePreview);

    async function submitAssessment() {
      const basePrice = parseFloat(document.getElementById('basePrice').value);
      const discount = parseFloat(document.getElementById('discount').value) || 0;
      const deliveryDays = parseInt(document.getElementById('deliveryDays').value);

      if (!basePrice || !deliveryDays) {
        alert('请填写完整信息');
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/quotes/${currentQuote.id}/assess`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            operator_id: 'U001',
            base_price: basePrice,
            final_price: currentManuscript.word_count * basePrice * (1 - discount / 100),
            discount,
            delivery_days: deliveryDays,
            assessment_notes: document.getElementById('assessmentNotes').value
          })
        });

        const result = await response.json();
        if (result.success) {
          currentQuote = result.quote;
          hideAssessmentForm();
          await loadManuscript();
          alert('报价评估完成！');
        }
      } catch (error) {
        alert('评估失败');
      }
    }

    async function submitQuote() {
      try {
        const response = await fetch(`${API_BASE}/quotes/${currentQuote.id}/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ operator_id: 'U001' })
        });

        const result = await response.json();
        if (result.success) {
          await loadManuscript();
          alert('报价提交成功！');
        }
      } catch (error) {
        alert('提交失败');
      }
    }

    function openApproveQuoteModal() {
      document.getElementById('approveQuoteModal').classList.add('active');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    async function approveQuote() {
      try {
        const response = await fetch(`${API_BASE}/quotes/${currentQuote.id}/approve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ operator_id: 'U001', notes: document.getElementById('approveNotes').value })
        });

        const result = await response.json();
        if (result.success) {
          closeModal('approveQuoteModal');
          await loadManuscript();
          alert('报价已确认！');
        }
      } catch (error) {
        alert('确认失败');
      }
    }

    function showAssignTranslatorForm() {
      const select = document.getElementById('translatorSelect');
      select.innerHTML = allUsers.filter(u => u.role === '译员').map(u => `<option value="${u.id}">${u.name}</option>`).join('');
      document.getElementById('assignTranslatorForm').classList.add('active');
    }

    function hideAssignTranslatorForm() {
      document.getElementById('assignTranslatorForm').classList.remove('active');
    }

    async function assignTranslator() {
      const translatorId = document.getElementById('translatorSelect').value;
      const dueDate = document.getElementById('dueDate').value;

      if (!translatorId || !dueDate) {
        alert('请填写完整信息');
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/manuscripts/${currentManuscript.id}/assign-translator`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ operator_id: 'U001', translator_id: translatorId, due_date: dueDate })
        });

        const result = await response.json();
        if (result.success) {
          hideAssignTranslatorForm();
          await loadManuscript();
          alert('译员分配成功！');
        }
      } catch (error) {
        alert('分配失败');
      }
    }

    async function startTranslation() {
      try {
        const response = await fetch(`${API_BASE}/manuscripts/${currentManuscript.id}/start-translation`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ operator_id: currentManuscript.translator_id })
        });

        const result = await response.json();
        if (result.success) {
          await loadManuscript();
          alert('开始翻译！');
        }
      } catch (error) {
        alert('操作失败');
      }
    }

    function showProgressForm() {
      document.getElementById('progressInput').value = currentManuscript.progress || 0;
      document.getElementById('progressForm').classList.add('active');
    }

    function hideProgressForm() {
      document.getElementById('progressForm').classList.remove('active');
    }

    async function updateProgress() {
      const progress = parseInt(document.getElementById('progressInput').value);

      try {
        const response = await fetch(`${API_BASE}/manuscripts/${currentManuscript.id}/update-progress`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ operator_id: currentManuscript.translator_id, progress })
        });

        const result = await response.json();
        if (result.success) {
          hideProgressForm();
          await loadManuscript();
          alert('进度更新成功！');
        }
      } catch (error) {
        alert('更新失败');
      }
    }

    async function submitTranslation() {
      try {
        const response = await fetch(`${API_BASE}/manuscripts/${currentManuscript.id}/submit-translation`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ operator_id: currentManuscript.translator_id })
        });

        const result = await response.json();
        if (result.success) {
          hideProgressForm();
          await loadManuscript();
          alert('翻译已提交！');
        }
      } catch (error) {
        alert('提交失败');
      }
    }

    function showAssignReviewerForm() {
      const select = document.getElementById('reviewerSelect');
      select.innerHTML = allUsers.filter(u => u.role === '审校').map(u => `<option value="${u.id}">${u.name}</option>`).join('');
      document.getElementById('assignReviewerForm').classList.add('active');
    }

    function hideAssignReviewerForm() {
      document.getElementById('assignReviewerForm').classList.remove('active');
    }

    async function assignReviewer() {
      const reviewerId = document.getElementById('reviewerSelect').value;

      try {
        const response = await fetch(`${API_BASE}/manuscripts/${currentManuscript.id}/assign-reviewer`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ operator_id: 'U001', reviewer_id: reviewerId })
        });

        const result = await response.json();
        if (result.success) {
          hideAssignReviewerForm();
          await loadManuscript();
          alert('审校分配成功！');
        }
      } catch (error) {
        alert('分配失败');
      }
    }

    function showReviewForm() {
      document.getElementById('reviewProgressInput').value = currentManuscript.review_progress || 0;
      document.getElementById('reviewForm').classList.add('active');
    }

    function hideReviewForm() {
      document.getElementById('reviewForm').classList.remove('active');
    }

    async function updateReviewProgress() {
      const progress = parseInt(document.getElementById('reviewProgressInput').value);

      try {
        const response = await fetch(`${API_BASE}/manuscripts/${currentManuscript.id}/update-review-progress`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ operator_id: currentManuscript.reviewer_id, review_progress: progress })
        });

        const result = await response.json();
        if (result.success) {
          hideReviewForm();
          await loadManuscript();
          alert('审校进度更新成功！');
        }
      } catch (error) {
        alert('更新失败');
      }
    }

    async function submitReview() {
      try {
        const response = await fetch(`${API_BASE}/manuscripts/${currentManuscript.id}/submit-review`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            operator_id: currentManuscript.reviewer_id,
            review_notes: document.getElementById('reviewNotes').value 
          })
        });

        const result = await response.json();
        if (result.success) {
          hideReviewForm();
          await loadManuscript();
          alert('审校完成！');
        }
      } catch (error) {
        alert('提交失败');
      }
    }

    async function startAssessment() {
      try {
        const response = await fetch(`${API_BASE}/manuscripts/${currentManuscript.id}/start-assessment`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ operator_id: 'U001' })
        });

        const result = await response.json();
        if (result.success) {
          currentQuote = result.quote;
          showAssessmentForm();
        }
      } catch (error) {
        alert('启动评估失败');
      }
    }

    loadManuscript();
  </script>
</body>
</html>
