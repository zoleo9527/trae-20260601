<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>口腔耗材商 - 临期预警与换货处理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="app-logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="6" fill="#2563EB"/>
            <path d="M8 14h12M14 8v12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          <span class="app-title">临期换货</span>
        </div>
      </div>

      <div class="role-selector">
        <label class="role-label">当前角色</label>
        <div class="role-options" id="roleOptions">
          <button class="role-btn active" data-role="sales_admin">
            <span class="role-icon">📋</span>销售内勤
          </button>
          <button class="role-btn" data-role="warehouse">
            <span class="role-icon">📦</span>仓库员
          </button>
          <button class="role-btn" data-role="after_sales">
            <span class="role-icon">🤝</span>售后专员
          </button>
        </div>
      </div>

      <nav class="nav-menu">
        <a class="nav-item active" data-view="dashboard">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>工作台</span>
        </a>
        <a class="nav-item" data-view="warnings">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2L16 15H2L9 2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9 7v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="9" cy="12.5" r="0.7" fill="currentColor"/></svg>
          <span>临期预警</span>
          <span class="nav-badge" id="warningBadge" style="display:none">0</span>
        </a>
        <a class="nav-item" data-view="exchanges">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 9h12M12 5l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>换货处理</span>
          <span class="nav-badge" id="exchangeBadge" style="display:none">0</span>
        </a>
        <a class="nav-item" data-view="history">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M9 5v4l2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>操作历史</span>
        </a>
        <a class="nav-item" data-view="recent">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M6 6h6M6 9h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>最近打开</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="offline-indicator" id="offlineIndicator" style="display:none">
          <span class="offline-dot"></span>离线模式
        </div>
      </div>
    </aside>

    <main class="main-content" id="mainContent">
      <div class="view-container" id="viewContainer">
        <!-- 动态渲染 -->
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal" id="modalContent">
      <!-- 动态渲染 -->
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>
</html>
