<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>轮胎门店管理系统</title>
    <style>
      :root {
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --success-color: #16a34a;
        --warning-color: #f59e0b;
        --danger-color: #dc2626;
        --info-color: #0ea5e9;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --border-color: #e2e8f0;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-color); color: var(--text-primary); line-height: 1.6; }
      .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
      .card { background: var(--card-bg); border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid var(--border-color); padding: 20px; margin-bottom: 20px; }
      .btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px; border-radius: 6px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
      .btn-primary { background: var(--primary-color); color: white; }
      .btn-primary:hover { background: var(--primary-hover); }
      .btn-success { background: var(--success-color); color: white; }
      .btn-warning { background: var(--warning-color); color: white; }
      .btn-danger { background: var(--danger-color); color: white; }
      .btn-outline { border: 1px solid var(--border-color); background: transparent; color: var(--text-primary); }
      .btn-sm { padding: 4px 12px; font-size: 13px; }
      .form-group { margin-bottom: 16px; }
      .form-group label { display: block; margin-bottom: 6px; font-weight: 500; }
      .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; }
      .form-group textarea { resize: vertical; min-height: 80px; }
      .table { width: 100%; border-collapse: collapse; margin-top: 16px; }
      .table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
      .table th { background: var(--bg-color); font-weight: 600; color: var(--text-secondary); }
      .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
      .badge-success { background: #dcfce7; color: #16a34a; }
      .badge-warning { background: #fef3c7; color: #f59e0b; }
      .badge-danger { background: #fee2e2; color: #dc2626; }
      .badge-info { background: #dbeafe; color: #3b82f6; }
      .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
      .modal-content { background: white; border-radius: 8px; padding: 24px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
      .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
      .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-secondary); }
      .nav { display: flex; gap: 8px; margin-bottom: 20px; }
      .nav button { padding: 10px 20px; border: none; background: white; border-radius: 6px; cursor: pointer; font-weight: 500; }
      .nav button.active { background: var(--primary-color); color: white; }
      .search-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
      .search-bar input, .search-bar select { padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; }
      .flex-end { display: flex; justify-content: flex-end; gap: 8px; }
      .mt-20 { margin-top: 20px; }
      .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
      .login-card { background: white; border-radius: 16px; padding: 40px; width: 90%; max-width: 400px; }
      .login-card h1 { text-align: center; margin-bottom: 8px; }
      .role-buttons { display: flex; gap: 12px; margin-bottom: 24px; }
      .role-btn { flex: 1; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; }
      .role-btn.active { border-color: var(--primary-color); background: #eff6ff; color: var(--primary-color); }
      .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
      .order-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
      .info-row { display: flex; flex-direction: column; }
      .info-row .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
      .info-row .value { font-weight: 500; }
      .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
      .empty-text { text-align: center; color: var(--text-secondary); padding: 20px; }
      .log-list { margin-top: 16px; }
      .log-item { padding: 12px; border-bottom: 1px solid var(--border-color); }
      .log-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
      .log-action { font-weight: 600; color: var(--primary-color); }
      .log-time { font-size: 12px; color: var(--text-secondary); }
      .check-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
      .check-item { display: flex; align-items: center; gap: 12px; }
      .check-btn { flex: 1; text-align: left; padding: 10px 12px; font-size: 14px; }
      .check-status { font-size: 12px; color: var(--text-secondary); min-width: 60px; text-align: right; }
      .summary-row { display: flex; justify-content: center; gap: 40px; padding: 16px; background: var(--bg-color); border-radius: 8px; margin-bottom: 16px; }
      .summary-value { font-size: 20px; font-weight: 600; }
      .summary-value.success { color: var(--success-color); }
      .summary-value.danger { color: var(--danger-color); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
