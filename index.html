<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>窗帘门店-售后调整与尾款催收</title>
<style>
:root{--primary:#2563eb;--primary-light:#eff6ff;--primary-hover:#1d4ed8;--success:#10b981;--success-light:#ecfdf5;--warning:#f59e0b;--warning-light:#fef3c7;--danger:#ef4444;--danger-light:#fee2e2;--info:#8b5cf6;--info-light:#f5f3ff;--gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-300:#cbd5e1;--gray-400:#94a3b8;--gray-500:#64748b;--gray-600:#475569;--gray-700:#334155;--gray-800:#1e293b;--gray-900:#0f172a;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--gray-100);color:var(--gray-800);font-size:14px;line-height:1.5}
.container{max-width:1400px;margin:0 auto;padding:16px}
.page-header{background:linear-gradient(135deg,var(--primary),var(--info));color:#fff;padding:20px 24px;border-radius:12px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 12px rgba(37,99,235,.2)}
.page-header h1{font-size:22px;font-weight:600}.page-header .sub{opacity:.85;font-size:13px;margin-top:4px}
.role-bar{display:flex;gap:8px;background:rgba(255,255,255,.15);padding:4px;border-radius:8px}
.role-bar button{background:transparent;border:none;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.role-bar button.active{background:#fff;color:var(--primary);font-weight:500}
.stats{margin-bottom:16px}.stat-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.stat-card{flex:1;min-width:160px;padding:16px;border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:all .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.stat-card .label{font-size:12px;color:var(--gray-500);margin-bottom:6px}
.stat-card .value{font-size:22px;font-weight:700;color:var(--gray-800)}
.stat-card .value.sm{font-size:18px}
.stat-card.primary .value{color:var(--primary)}.stat-card.success .value{color:var(--success)}
.stat-card.warning .value{color:var(--warning)}.stat-card.danger .value{color:var(--danger)}
.stat-card.info .value{color:var(--info)}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;padding:12px;background:#fff;border-radius:8px;margin-bottom:12px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.filter-bar input,.filter-bar select{padding:7px 10px;border:1px solid var(--gray-200);border-radius:6px;font-size:13px;outline:none;background:#fff;transition:border-color .2s}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--primary)}
.filter-bar input{width:180px}
.btn{padding:7px 16px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-weight:500;white-space:nowrap;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-default{background:var(--gray-100);color:var(--gray-700);border:1px solid var(--gray-200)}.btn-default:hover{background:var(--gray-200)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#059669}
.btn-warning{background:var(--warning);color:#fff}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#dc2626}
.btn-info{background:var(--info);color:#fff}.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:12px;align-items:center;padding:12px;background:#fff;border-radius:8px 8px 0 0;border-bottom:1px solid var(--gray-200);flex-wrap:wrap}
.toolbar .count-info{margin-left:auto;font-size:13px;color:var(--gray-500)}
.toolbar .count-info b{color:var(--primary)}.toolbar .spacer{flex:1}
.checkbox{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
.table-wrap{background:#fff;border-radius:0 0 8px 8px;overflow-x:auto;box-shadow:0 1px 3px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse;min-width:1200px}
thead th{background:var(--gray-50);padding:12px 10px;text-align:left;font-size:12px;color:var(--gray-600);font-weight:600;border-bottom:1px solid var(--gray-200);white-space:nowrap}
tbody td{padding:12px 10px;border-bottom:1px solid var(--gray-100);font-size:13px;vertical-align:middle}
tbody tr:hover{background:var(--gray-50)}
.order-id{color:var(--primary);font-weight:500;cursor:pointer;font-family:monospace}
.customer-cell{display:flex;flex-direction:column}
.customer-name{font-weight:500}.customer-phone{font-size:11px;color:var(--gray-400)}
.product-cell{font-size:12px;color:var(--gray-600);max-width:180px}
.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:500;white-space:nowrap}
.badge-primary{background:var(--primary-light);color:var(--primary)}
.badge-success{background:var(--success-light);color:var(--success)}
.badge-warning{background:var(--warning-light);color:var(--warning)}
.badge-danger{background:var(--danger-light);color:var(--danger)}
.badge-info{background:var(--info-light);color:var(--info)}
.badge-gray{background:var(--gray-100);color:var(--gray-600)}
.amt{font-family:monospace;font-weight:500}.amt.danger{color:var(--danger)}.amt.success{color:var(--success)}
.overdue-tag{color:var(--danger);font-weight:600}
.act-group{display:flex;gap:4px;flex-wrap:wrap}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-top:1px solid var(--gray-200);border-radius:0 0 8px 8px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.page-nav{display:flex;gap:6px;align-items:center}
.page-nav button{min-width:32px;height:32px;border:1px solid var(--gray-200);background:#fff;border-radius:6px;cursor:pointer;font-size:13px;padding:0 10px;transition:all .2s}
.page-nav button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.page-nav button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.page-nav button:disabled{opacity:.4;cursor:not-allowed}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modalbg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:1}
.modaldialog{background:#fff;border-radius:12px;max-width:720px;width:92vw;max-height:88vh;position:relative;z-index:2;display:flex;flex-direction:column;overflow:hidden}
.modaldialog.lg{max-width:880px}
.modalhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--gray-200);flex-shrink:0}
.modalhead h3{font-size:16px;font-weight:600;color:var(--gray-800)}
.modalclose{width:28px;height:28px;border:none;background:var(--gray-100);border-radius:6px;cursor:pointer;color:var(--gray-500);font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modalclose:hover{background:var(--gray-200);color:var(--gray-700)}
.modalbody{padding:20px;overflow-y:auto;flex:1}
.modalfoot{padding:14px 20px;border-top:1px solid var(--gray-200);display:flex;gap:10px;justify-content:flex-end;flex-shrink:0;background:var(--gray-50)}
.info-block{margin-bottom:20px}
.info-block h4{font-size:14px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;gap:6px}
.info-block h4::before{content:"";width:3px;height:14px;background:var(--primary);border-radius:2px}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 20px}
.info-item{display:flex;font-size:13px}
.info-item .k{color:var(--gray-500);min-width:80px;flex-shrink:0}
.info-item .v{color:var(--gray-800);font-weight:500}.info-item.full{grid-column:1/-1}
.flow{display:flex;align-items:flex-start;padding:12px;background:var(--gray-50);border-radius:8px;margin-bottom:20px;overflow-x:auto}
.flowrow{display:flex;align-items:center;gap:0}
.fnode{display:flex;flex-direction:column;align-items:center;min-width:80px;text-align:center;flex-shrink:0}
.fdot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;background:var(--gray-300);margin-bottom:6px;position:relative;z-index:2}
.fnode.done .fdot{background:var(--success)}
.fnode.current .fdot{background:var(--primary);box-shadow:0 0 0 4px var(--primary-light)}
.flabel{font-size:11px;color:var(--gray-600);line-height:1.3}
.fnode.done .flabel,.fnode.current .flabel{color:var(--gray-800);font-weight:500}
.fseg{width:36px;height:2px;background:var(--gray-300);margin-top:15px;flex-shrink:0;position:relative;z-index:1}
.fseg.done{background:var(--success)}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--gray-200)}
.timeline-item{position:relative;margin-bottom:14px}
.timeline-item::before{content:"";position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary-light)}
.timeline-item.success::before{background:var(--success);box-shadow:0 0 0 2px var(--success-light)}
.timeline-item.warning::before{background:var(--warning);box-shadow:0 0 0 2px var(--warning-light)}
.timeline-item.danger::before{background:var(--danger);box-shadow:0 0 0 2px var(--danger-light)}
.tl-time{font-size:11px;color:var(--gray-400);margin-bottom:2px}
.tl-title{font-size:13px;font-weight:600;color:var(--gray-800);margin-bottom:2px}
.tl-desc{font-size:12px;color:var(--gray-600);line-height:1.5}
.tl-user{font-size:11px;color:var(--info)}
.collectcards{display:flex;flex-direction:column;gap:10px}
.collectcard{padding:12px;border:1px solid var(--gray-200);border-radius:8px;background:var(--gray-50)}
.collectcard.paid{background:var(--success-light);border-color:var(--success)}
.collectcard .cc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.collectcard .cc-result{font-size:12px;font-weight:600}
.collectcard .cc-time{font-size:11px;color:var(--gray-400)}
.collectcard .cc-amount{font-family:monospace;font-weight:600;font-size:14px;margin:4px 0}
.collectcard .cc-note{font-size:12px;color:var(--gray-600)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--gray-700);margin-bottom:6px}
.form-group label .req{color:var(--danger);margin-left:2px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--gray-200);border-radius:6px;font-size:13px;outline:none;transition:border-color .2s;font-family:inherit;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary)}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
.after-info{background:var(--info-light);padding:12px;border-radius:8px;margin-bottom:16px}
.collect-info{background:var(--warning-light);padding:14px;border-radius:8px;margin-bottom:16px}
.collect-info .ci-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.collect-info .ci-row .k{color:var(--gray-600)}
.collect-info .ci-row .v{font-weight:600;font-family:monospace}
.collect-info .ci-row.balance{font-size:15px;padding-top:8px;margin-top:8px;border-top:1px dashed rgba(245,158,11,.3)}
.collect-info .ci-row.balance .v{color:var(--danger);font-size:18px}
.batch-info{background:var(--primary-light);padding:14px;border-radius:8px;margin-bottom:16px}
.batch-info .bi-title{font-weight:600;color:var(--primary);margin-bottom:8px}
.batch-info .bi-list{font-size:12px;color:var(--gray-700);max-height:120px;overflow-y:auto}
.empty-tip{padding:60px 20px;text-align:center;color:var(--gray-400)}
.empty-tip .icon{font-size:48px;margin-bottom:12px;opacity:.5}
#toastContainer{position:fixed;top:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#fff;border-radius:8px;padding:12px 16px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:flex;align-items:center;gap:10px;font-size:13px;min-width:240px;animation:slideIn .3s ease;pointer-events:auto;border-left:4px solid var(--primary)}
.toast.success{border-left-color:var(--success)}.toast.warning{border-left-color:var(--warning)}.toast.danger{border-left-color:var(--danger)}
.toast .ti-icon{font-size:18px;flex-shrink:0}
.toast.success .ti-icon{color:var(--success)}.toast.warning .ti-icon{color:var(--warning)}.toast.danger .ti-icon{color:var(--danger)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{to{transform:translateX(100%);opacity:0}}
.toast.fade{animation:slideOut .3s ease forwards}
.tag-list{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:10px;padding:1px 6px;border-radius:3px;background:var(--gray-100);color:var(--gray-600)}
</style></head><body>
<div class="container">
<div class="page-header">
  <div><h1>🏠 窗帘门店 · 售后调整与尾款催收系统</h1><div class="sub">订单全流程跟踪 · 售后问题闭环 · 回款高效管理</div></div>
  <div class="role-bar" id="roleBar">
    <button data-role="boss" class="active">老板</button>
    <button data-role="guide">导购</button>
    <button data-role="measure">测量</button>
    <button data-role="install">安装</button>
    <button data-role="finance">财务</button>
  </div>
</div>
<div class="stats">
  <div class="stat-row">
    <div class="stat-card info"><div class="label">📋 待处理订单</div><div class="value" id="statRest">0</div></div>
    <div class="stat-card warning"><div class="label">🔍 售后待复核</div><div class="value" id="statAfterReview">0</div></div>
    <div class="stat-card primary"><div class="label">🔧 售后处理中</div><div class="value" id="statAfterProcess">0</div></div>
    <div class="stat-card warning"><div class="label">💰 待催收尾款</div><div class="value" id="statCollect">0</div></div>
    <div class="stat-card danger"><div class="label">⚠️ 已逾期订单</div><div class="value" id="statOverdue">0</div></div>
    <div class="stat-card danger"><div class="label">⏰ 延期未处理</div><div class="value" id="statDelay">0</div></div>
  </div>
  <div class="stat-row">
    <div class="stat-card info"><div class="label">🤝 承诺回款订单</div><div class="value" id="statPromise">0</div></div>
    <div class="stat-card success"><div class="label">✅ 已结清订单</div><div class="value" id="statDone">0</div></div>
    <div class="stat-card success"><div class="label">💵 本月回款(元)</div><div class="value sm" id="statAmt">0</div></div>
    <div class="stat-card primary"><div class="label">📊 总订单金额(元)</div><div class="value sm" id="statTotal">0</div></div>
    <div class="stat-card info"><div class="label">🔩 补录待审</div><div class="value" id="statSupp">0</div></div>
    <div class="stat-card primary"><div class="label">📈 回款完成率</div><div class="value sm" id="statRestPct">0%</div></div>
  </div>
</div>
<div class="filter-bar">
  <input id="searchKeyword" type="text" placeholder="🔍 搜索订单号/客户/电话/小区">
  <select id="filterMainStatus"><option value="">全部主状态</option><option value="0">意向客户</option><option value="1">已预约测量</option><option value="2">报价阶段</option><option value="3">已签合同</option><option value="4">生产制作中</option><option value="5">待安装</option><option value="6">已安装</option><option value="7">待验收</option><option value="8">已验收</option><option value="9">已结清</option></select>
  <select id="filterAfterStatus"><option value="">全部售后状态</option><option value="无">无售后</option><option value="待复核">待复核</option><option value="复核通过">复核通过</option><option value="复核驳回">复核驳回</option><option value="处理中">处理中</option><option value="补录待审">补录待审</option><option value="售后完成">售后完成</option></select>
  <select id="filterCollectStatus"><option value="">全部回款状态</option><option value="无需催收">无需催收</option><option value="待催收">待催收</option><option value="催收中">催收中</option><option value="承诺回款">承诺回款</option><option value="部分回款">部分回款</option><option value="已回款">已回款</option><option value="坏账风险">坏账风险</option></select>
  <select id="filterDateRange"><option value="">全部时间</option><option value="7">近7天</option><option value="30">近30天</option><option value="90">近90天</option><option value="180">半年内</option></select>
  <select id="filterGuide"><option value="">全部导购</option><option value="张敏">张敏</option><option value="李婷">李婷</option><option value="王芳">王芳</option><option value="赵玲">赵玲</option></select>
  <button class="btn btn-primary" id="searchBtn">🔍 搜索</button>
  <button class="btn btn-default" id="resetBtn">🔄 重置</button>
</div>
<div class="toolbar">
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;"><input type="checkbox" id="checkAll" class="checkbox"> 全选</label>
  <button class="btn btn-warning btn-sm" id="batchCollect">💰 批量催收</button>
  <button class="btn btn-info btn-sm" id="batchExport">📥 批量导出</button>
  <span class="spacer"></span>
  <div class="count-info">已选 <b id="selCount">0</b> 项 / 共 <b id="totalCount">0</b> 条订单</div>
  <button class="btn btn-success btn-sm" id="addAfterBtn">➕ 新建售后</button>
</div>
<div class="table-wrap">
  <table><thead><tr>
    <th style="width:40px;"><input type="checkbox" class="checkbox" onclick="return false;"></th>
    <th>订单编号</th><th>客户信息</th><th>产品 / 小区</th><th>导购</th><th>主状态</th><th>售后状态</th><th>回款状态</th><th>逾期</th><th>已付(元)</th><th>尾款(元)</th><th>日期</th><th style="width:200px;">操作</th>
  </tr></thead><tbody id="tableBody"></tbody></table>
</div>
<div class="pagination">
  <div id="pageCount" style="font-size:13px;color:var(--gray-500);"></div>
  <div class="page-nav" id="pageNav"></div>
</div>
</div>

<div class="modal" id="detailModal"><div class="modalbg" onclick="closeModal('detailModal')"></div>
  <div class="modaldialog lg"><div class="modalhead"><h3>📋 订单详情</h3><button class="modalclose" onclick="closeModal('detailModal')">×</button></div>
  <div class="modalbody" id="detailBody"></div>
  <div class="modalfoot"><button class="btn btn-default" onclick="closeModal('detailModal')">关闭</button></div></div></div>

<div class="modal" id="afterModal"><div class="modalbg" onclick="closeModal('afterModal')"></div>
  <div class="modaldialog"><div class="modalhead"><h3>🔧 售后处理</h3><button class="modalclose" onclick="closeModal('afterModal')">×</button></div>
  <div class="modalbody">
    <div class="after-info" id="afterInfo"></div>
    <div class="form-group"><label>处理动作 <span class="req">*</span></label>
      <select id="afterAction"><option value="submit">提交售后（待复核）</option><option value="approve">复核通过</option><option value="reject">复核驳回</option><option value="process">开始处理</option><option value="supply">补录信息（待审）</option><option value="close">售后完成</option></select></div>
    <div class="form-row">
      <div class="form-group"><label>金额调整(元)</label><input type="number" id="afterAdj" placeholder="正数加/负数减" step="1"></div>
      <div class="form-group"><label>附件凭证</label><input type="text" id="afterAttach" placeholder="图片/文件链接，选填"></div></div>
    <div class="form-group"><label>处理备注 <span class="req">*</span></label><textarea id="afterNote" placeholder="请详细说明处理情况、原因、措施等..."></textarea></div>
  </div>
  <div class="modalfoot"><button class="btn btn-default" onclick="closeModal('afterModal')">取消</button><button class="btn btn-primary" onclick="submitAfter()">✅ 提交处理</button></div></div></div>

<div class="modal" id="collectModal"><div class="modalbg" onclick="closeModal('collectModal')"></div>
  <div class="modaldialog"><div class="modalhead"><h3>💰 催收回款</h3><button class="modalclose" onclick="closeModal('collectModal')">×</button></div>
  <div class="modalbody">
    <div class="collect-info" id="collectInfo"></div>
    <div class="form-group"><label>催收结果 <span class="req">*</span></label>
      <select id="collectResult"><option value="promise">客户承诺回款</option><option value="paid">客户已回款</option><option value="partial">客户部分回款</option><option value="delay">客户要求延期</option><option value="bad">失联/坏账风险</option></select></div>
    <div class="form-row">

        <select id="aaType"><option value="质量问题">产品质量问题</option><option value="尺寸问题">尺寸/测量问题</option><option value="安装问题">安装施工问题</option><option value="交期问题">交货延期</option><option value="色差问题">颜色/色差</option><option value="配件缺失">配件缺失</option><option value="服务态度">服务态度</option><option value="其他">其他问题</option></select></div>

        <select id="aaRole"><option value="待定">待判定</option><option value="工厂">工厂责任</option><option value="测量">测量责任</option><option value="安装">安装责任</option><option value="导购">导购责任</option><option value="客户">客户责任</option><option value="双方">双方责任</option></select></div></div>
    <div class="form-group"><label>问题描述 <span class="req">*</span></label><textarea id="aaDesc" placeholder="请详细描述问题情况、发生时间、客户诉求..."></textarea></div>

      <select id="aaUser"><option value="张敏">张敏（导购主管）</option><option value="李婷">李婷（售后专员）</option><option value="王芳">王芳（店长）</option><option value="赵玲">赵玲（客服）</option><option value="陈工">陈工（技术主管）</option></select></div>

<div id="toastContainer"></div>
<script>

let role = "boss", orders = [], currentPage = 1, pageSize = 8, selected = new Set(), currentOrderId = null;
const CUSTOMERS = ["王明远","李秀兰","张伟国","刘淑芬","陈建明","杨丽娟","赵志强","黄美玲","周俊杰","吴秀芳","郑海涛","孙梦琪","冯志强","陈雅婷","褚文博","卫东明","蒋晓燕","沈国华","韩梅梅","杨帆飞","朱明辉","秦丽娜","尤智强","许文博","何丽娜","吕志华","施佳怡","张梦瑶"];
const DISTRICTS = ["碧桂园·翡翠湾","恒大·御景半岛","万科·金域蓝湾","保利·中央公园","绿地·香颂","龙湖·春江郦城","融创·东南海","金地·自在城","华润·橡树湾","中海·寰宇天下","招商·雍景湾","佳兆业·水岸华都","阳光城·丽景湾","雅居乐·剑桥郡","华发·又一城","时代·倾城"];
const PRODUCTS = ["电动梦幻帘+纱帘套装","亚麻遮光窗帘+纱帘","雪尼尔提花窗帘","百叶窗+罗马帘组合","香格里拉帘","卷帘+柔纱帘套装","轻奢绣花窗帘+幔头","北欧简约棉麻窗帘","中式红木纹遮光帘","儿童房卡通窗帘套装","阳台遮光卷帘","书房百叶窗帘"];
const GUIDES = ["张敏","李婷","王芳","赵玲"];
const MEASURES = ["陈工","刘工","孙师傅"];
const INSTALLS = ["王师傅","李师傅","赵师傅"];
const MAIN_ST = ["意向客户","已预约测量","报价阶段","已签合同","生产制作中","待安装","已安装","待验收","已验收","已结清"];
const AFTER_ST = ["无","待复核","复核通过","复核驳回","处理中","补录待审","售后完成"];
const COLLECT_ST = ["无需催收","待催收","催收中","承诺回款","部分回款","已回款","坏账风险"];
const MAIN_ST_CLASS = ["gray","info","info","primary","warning","warning","success","primary","success","success"];
const AFTER_ST_CLASS = ["gray","warning","success","danger","primary","info","success"];
const COLLECT_ST_CLASS = ["gray","warning","warning","info","info","success","danger"];
function Q(id){ return document.getElementById(id); }
function QQ(sel){ return document.querySelectorAll(sel); }
function pad(n){ return n<10?"0"+n:""+n; }
function fmtDate2(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function randPick(arr){ return arr[randInt(0,arr.length-1)]; }
function fmtMoney2(n){ return Number(n).toLocaleString("zh-CN",{minimumFractionDigits:0,maximumFractionDigits:0}); }

function genOrders(){
  const today = new Date("2026-06-16");
  const list = [];
  const templates = [
    [9,"无","已回款",1.0,false,false],[9,"售后完成","已回款",1.0,false,false],
    [8,"无","部分回款",0.8,false,false],[8,"售后完成","催收中",0.7,true,false],
    [8,"处理中","待催收",0.6,false,true],[7,"无","待催收",0.6,false,false],
    [7,"复核通过","催收中",0.65,true,false],[7,"待复核","无需催收",0.55,false,false],
    [6,"无","无需催收",0.5,false,false],[6,"补录待审","无需催收",0.5,false,true],
    [6,"复核驳回","无需催收",0.5,false,false],[5,"无","无需催收",0.4,false,false],
    [5,"待复核","无需催收",0.4,false,false],[4,"无","无需催收",0.3,false,false],
    [4,"处理中","无需催收",0.3,false,true],[3,"无","无需催收",0.3,false,false],
    [3,"售后完成","无需催收",0.3,false,false],[2,"无","无需催收",0,false,false],
    [2,"待复核","无需催收",0,false,false],[1,"无","无需催收",0,false,false],
    [0,"无","无需催收",0,false,false],[8,"售后完成","承诺回款",0.75,false,false],
    [7,"售后完成","承诺回款",0.6,false,false],[8,"处理中","催收中",0.5,true,true],
    [6,"处理中","无需催收",0.5,false,true],[5,"复核通过","无需催收",0.4,false,false],
    [8,"无","坏账风险",0.3,true,true],[7,"补录待审","催收中",0.6,true,false],
  ];
  for(let i=0;i<templates.length;i++){
    const t = templates[i];
    const ms = t[0], as = t[1], cs = t[2], paidPct = t[3], overdue = t[4], delay = t[5];
    const customer = CUSTOMERS[i % CUSTOMERS.length];
    const phone = "138" + String(randInt(10000000,99999999));
    const district = DISTRICTS[i % DISTRICTS.length];
    const product = PRODUCTS[randInt(0,PRODUCTS.length-1)];
    const guide = GUIDES[i % GUIDES.length];
    const measure = MEASURES[i % MEASURES.length];
    const install = INSTALLS[i % INSTALLS.length];
    const price = randInt(3800,28800);
    const paid = Math.round(price * paidPct);
    const adjust = (as !== "无" && Math.random()>0.5) ? randInt(-800,500) : 0;
    const totalPrice = price + adjust;
    const balance = Math.max(0, totalPrice - paid);
    const daysAgo = randInt(2, 120);
    const createDate = new Date(today.getTime() - daysAgo*86400000);
    const createDateStr = fmtDate2(createDate);
    let promiseDate = null;
    let overdueDays = 0;
    if(cs === "承诺回款"){ promiseDate = fmtDate2(new Date(today.getTime()+randInt(1,15)*86400000)); }
    if(overdue) overdueDays = randInt(3,45);
    let delayDays = 0;
    if(delay) delayDays = randInt(2,20);
    const afterTimeline = [];
    if(as !== "无"){
      afterTimeline.push({type:"primary",time:fmtDate2(createDate),title:"售后提交",desc:"客户反馈相关问题，已登记售后单",user:guide});
      if(as !== "待复核" && as !== "复核驳回") afterTimeline.push({type:"success",time:fmtDate2(new Date(createDate.getTime()+86400000)),title:"复核通过",desc:"售后经理复核通过，进入处理流程",user:"王芳"});
      if(as === "复核驳回") afterTimeline.push({type:"danger",time:fmtDate2(new Date(createDate.getTime()+86400000)),title:"复核驳回",desc:"资料不完整，请补充详情后重新提交",user:"王芳"});
      if(["处理中","补录待审","售后完成"].includes(as)) afterTimeline.push({type:"warning",time:fmtDate2(new Date(createDate.getTime()+86400000*3)),title:"开始处理",user:measure,desc:"已安排技术人员上门核实并处理"});
      if(as === "补录待审") afterTimeline.push({type:"info",time:fmtDate2(new Date(createDate.getTime()+86400000*6)),title:"补录信息",user:"李婷",desc:"补录费用调整明细及处理凭证，待审核"});
      if(as === "售后完成") afterTimeline.push({type:"success",time:fmtDate2(new Date(createDate.getTime()+86400000*8)),title:"售后完成",user:"王芳",desc:"问题已解决，客户确认满意，售后闭环"});
    }
    const collectList = [];
    if(["催收中","承诺回款","部分回款","已回款","坏账风险","待催收"].includes(cs)){
      if(ms>=6) collectList.push({result:"催收中",time:fmtDate2(new Date(today.getTime()-86400000*5)),note:"首次电话提醒客户验收后结清尾款，客户表示近期安排",amount:0,user:guide,promise:null,type:"催收"});
      if(cs === "部分回款"){ const pa = Math.round(balance*0.4); collectList.unshift({result:"部分回款",time:fmtDate2(new Date(today.getTime()-86400000*2)),note:"客户转账部分款项，剩余将尽快安排",amount:pa,user:"财务",promise:null,type:"回款"}); }
      if(cs === "承诺回款") collectList.unshift({result:"承诺回款",time:fmtDate2(today),note:"客户电话确认将在指定日期前完成支付",amount:0,user:guide,promise:promiseDate,type:"催收"});
      if(cs === "已回款") collectList.unshift({result:"已回款",time:fmtDate2(new Date(today.getTime()-86400000)),note:"尾款已全额到账，订单完成",amount:balance,user:"财务",promise:null,type:"回款"});
      if(cs === "催收中" && overdue) collectList.unshift({result:"催收中",time:fmtDate2(new Date(today.getTime()-86400000)),note:"第二次催收，客户仍未支付，已逾期，考虑上门",amount:0,user:guide,promise:null,type:"催收"});
    }
    const id = "CL" + (20260001 + i);
    list.push({
      id,customer,phone,district,product,guide,measure,install,
      price,adjust,totalPrice,paid,balance,
      mainStatus:ms,mainStatusName:MAIN_ST[ms],
      afterStatus:as,collectStatus:cs,
      createDate:createDateStr,
      overdue,overdueDays,delay,delayDays,promiseDate,
      afterTimeline,collectList,
      address:district+" "+randInt(1,30)+"栋"+randInt(1,32)+"0"+randInt(1,9),
      area:randInt(80,260),contractNo:"HT"+(202605000+i),
    });
  }
  list.sort((a,b) => b.createDate.localeCompare(a.createDate));
  return list;
}

function init(){
  Q("searchBtn").onclick = () => { currentPage = 1; renderTable(); renderPagination(); };
  Q("resetBtn").onclick = () => {
    Q("searchKeyword").value="";Q("filterMainStatus").value="";Q("filterAfterStatus").value="";
    Q("filterCollectStatus").value="";Q("filterDateRange").value="";Q("filterGuide").value="";
    currentPage=1;renderTable();renderPagination();toast("已重置筛选条件","success");
  };
  Q("searchKeyword").addEventListener("keydown",e=>{if(e.key==="Enter"){currentPage=1;renderTable();renderPagination();}});
  ["filterMainStatus","filterAfterStatus","filterCollectStatus","filterDateRange","filterGuide"].forEach(id=>{
    Q(id).addEventListener("change",()=>{currentPage=1;renderTable();renderPagination();});
  });
  Q("checkAll").onchange = (e) => {
    const checked = e.target.checked;
    const filtered = getFiltered();
    const start = (currentPage-1)*pageSize;
    const pageItems = filtered.slice(start, start+pageSize);
    pageItems.forEach(o => { if(checked) selected.add(o.id); else selected.delete(o.id); });
    renderTable(); updateSelCount();
  };
  QQ("#roleBar button").forEach(btn=>{
    btn.onclick = () => {
      QQ("#roleBar button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      role = btn.dataset.role;
      currentPage = 1; selected.clear(); refresh();
      toast("已切换为【"+btn.textContent+"】视图","info");
    };
  });
  Q("batchCollect").onclick = () => { if(selected.size===0){toast("请先选择订单","warning");return;} openBatchCollect(); };
  Q("batchExport").onclick = () => { const n = selected.size||getFiltered().length; toast("📥 已导出"+n+"条订单数据","success"); };
  Q("addAfterBtn").onclick = () => openAddAfter();
  document.addEventListener("click", e => {
    const btn = e.target.closest(".act-btn");
    if(btn){ switchAction(btn); return; }
    const cb = e.target.closest(".row-check");
    if(cb) return;
    const row = e.target.closest(".order-row");
    if(row) openDetail(row.dataset.id);
  });
  orders = genOrders();
  refresh();
}

function refresh(){ renderStats(); renderTable(); renderPagination(); updateSelCount(); }

function renderStats(){
  const today = new Date("2026-06-16");
  const monthStart = new Date("2026-06-01");
  const rest = orders.filter(o=>o.mainStatus<9 && o.collectStatus!=="已回款").length;
  const aReview = orders.filter(o=>o.afterStatus==="待复核").length;
  const aProcess = orders.filter(o=>["复核通过","处理中"].includes(o.afterStatus)).length;
  const collect = orders.filter(o=>["待催收","催收中","承诺回款","部分回款"].includes(o.collectStatus)).length;
  const overdue = orders.filter(o=>o.overdue).length;
  const delay = orders.filter(o=>o.delay).length;
  const promise = orders.filter(o=>o.collectStatus==="承诺回款").length;
  const done = orders.filter(o=>o.mainStatus===9 || o.collectStatus==="已回款").length;
  let amt = 0;
  orders.forEach(o=>{
    o.collectList.forEach(c=>{
      const d = new Date(c.time.replace(/-/g,"/"));
      if(c.amount>0 && d>=monthStart && d<=today) amt += c.amount;
    });
  });
  const total = orders.reduce((s,o)=>s+o.totalPrice,0);
  const supp = orders.filter(o=>o.afterStatus==="补录待审").length;
  const totalPaid = orders.reduce((s,o)=>s+o.paid,0);
  const totalTotal = orders.reduce((s,o)=>s+o.totalPrice,0);
  const pct = totalTotal>0 ? Math.round(totalPaid*100/totalTotal) : 0;
  Q("statRest").textContent = rest;
  Q("statAfterReview").textContent = aReview;
  Q("statAfterProcess").textContent = aProcess;
  Q("statCollect").textContent = collect;
  Q("statOverdue").textContent = overdue;
  Q("statDelay").textContent = delay;
  Q("statPromise").textContent = promise;
  Q("statDone").textContent = done;
  Q("statAmt").textContent = fmtMoney2(amt);
  Q("statTotal").textContent = fmtMoney2(total);
  Q("statSupp").textContent = supp;
  Q("statRestPct").textContent = pct + "%";
}

function getFiltered(){
  const kw = Q("searchKeyword").value.trim().toLowerCase();
  const fms = Q("filterMainStatus").value;
  const fas = Q("filterAfterStatus").value;
  const fcs = Q("filterCollectStatus").value;
  const fdr = Q("filterDateRange").value;
  const fg = Q("filterGuide").value;
  const today = new Date("2026-06-16");
  return orders.filter(o=>{
    if(role==="guide" && !GUIDES.includes(o.guide)) return false;
    if(role==="measure" && !MEASURES.includes(o.measure)) return false;
    if(role==="install" && !INSTALLS.includes(o.install)) return false;
    if(role==="finance" && o.mainStatus<=2) return false;
    if(kw){ const hay=(o.id+" "+o.customer+" "+o.phone+" "+o.district+" "+o.product+" "+o.address).toLowerCase(); if(!hay.includes(kw)) return false; }
    if(fms!=="" && String(o.mainStatus)!==fms) return false;
    if(fas!=="" && o.afterStatus!==fas) return false;
    if(fcs!=="" && o.collectStatus!==fcs) return false;
    if(fg!=="" && o.guide!==fg) return false;
    if(fdr!==""){ const days=parseInt(fdr); const d=new Date(o.createDate.replace(/-/g,"/")); const diff=(today-d)/86400000; if(diff>days) return false; }
    return true;
  });
}

function renderTable(){
  const filtered = getFiltered();
  const start = (currentPage-1)*pageSize;
  const pageItems = filtered.slice(start, start+pageSize);
  const tbody = Q("tableBody");
  Q("totalCount").textContent = filtered.length;
  if(pageItems.length===0){
    tbody.innerHTML = '<tr><td colspan="13"><div class="empty-tip"><div class="icon">📭</div><div>暂无符合条件的订单数据</div></div></td></tr>';
    return;
  }
  const pageIds = pageItems.map(o=>o.id);
  const allSel = pageIds.length>0 && pageIds.every(id=>selected.has(id));
  Q("checkAll").checked = allSel;
  let html = "";
  pageItems.forEach(o=>{
    const isSel = selected.has(o.id);
    const msIdx = o.mainStatus;
    const asIdx = AFTER_ST.indexOf(o.afterStatus);
    const csIdx = COLLECT_ST.indexOf(o.collectStatus);
    const overdueTag = o.overdue
      ? '<span class="overdue-tag">逾期'+o.overdueDays+'天</span>'
      : (o.delay ? '<span style="color:var(--warning);font-weight:600">延期'+o.delayDays+'天</span>' : '<span style="color:var(--gray-400)">-</span>');
    const ds = o.district.length>10?o.district.substring(0,10)+'…':o.district;
    const atag = o.adjust!==0 ? '<span class="tag" style="color:'+(o.adjust<0?'var(--danger)':'var(--success)')+';background:'+(o.adjust<0?'var(--danger-light)':'var(--success-light)')+'">'+(o.adjust<0?'-':'+')+Math.abs(o.adjust)+'</span>' : '';
    const collectBtn = (o.balance>0 && o.mainStatus>=6) ? '<button class="btn btn-success btn-sm act-btn" data-act="collect" data-id="'+o.id+'">催收</button>' : '';
    html += '<tr class="order-row" data-id="'+o.id+'">'
      +'<td><input type="checkbox" class="checkbox row-check" data-id="'+o.id+'" '+(isSel?'checked':'')+' onclick="event.stopPropagation(); toggleSel(\''+o.id+'\',this.checked)"></td>'
      +'<td><span class="order-id" onclick="event.stopPropagation();openDetail(\''+o.id+'\')">'+o.id+'</span></td>'
      +'<td><div class="customer-cell"><span class="customer-name">'+o.customer+'</span><span class="customer-phone">📱 '+o.phone+'</span></div></td>'
      +'<td><div class="product-cell" style="font-weight:500;color:var(--gray-700)">'+o.product+'</div><div class="tag-list"><span class="tag">📍 '+ds+'</span>'+atag+'</div></td>'
      +'<td>'+o.guide+'</td>'
      +'<td><span class="badge badge-'+MAIN_ST_CLASS[msIdx]+'">'+MAIN_ST[msIdx]+'</span></td>'
      +'<td><span class="badge badge-'+AFTER_ST_CLASS[asIdx<0?0:asIdx]+'">'+o.afterStatus+'</span></td>'
      +'<td><span class="badge badge-'+COLLECT_ST_CLASS[csIdx<0?0:csIdx]+'">'+o.collectStatus+'</span></td>'
      +'<td>'+overdueTag+'</td>'
      +'<td><span class="amt success">'+fmtMoney2(o.paid)+'</span></td>'
      +'<td><span class="amt '+(o.balance>0?'danger':'success')+'">'+fmtMoney2(o.balance)+'</span></td>'
      +'<td style="font-size:12px;color:var(--gray-500)">'+o.createDate+'</td>'
      +'<td><div class="act-group">'
      +'<button class="btn btn-primary btn-sm act-btn" data-act="detail" data-id="'+o.id+'">详情</button>'
      +'<button class="btn btn-warning btn-sm act-btn" data-act="after" data-id="'+o.id+'">售后</button>'
      +collectBtn
      +'</div></td>'
      +'</tr>';
  });
  tbody.innerHTML = html;
}

function toggleSel(id,checked){
  if(checked) selected.add(id); else selected.delete(id);
  updateSelCount();
  const filtered = getFiltered();
  const start = (currentPage-1)*pageSize;
  const pageItems = filtered.slice(start, start+pageSize);
  const allSel = pageItems.length>0 && pageItems.every(o=>selected.has(o.id));
  Q("checkAll").checked = allSel;
}
function updateSelCount(){ Q("selCount").textContent = selected.size; }

function renderPagination(){
  const filtered = getFiltered();
  const total = filtered.length;
  const totalPage = Math.max(1, Math.ceil(total/pageSize));
  if(currentPage>totalPage) currentPage = totalPage;
  Q("pageCount").textContent = '共 '+total+' 条记录，第 '+currentPage+' / '+totalPage+' 页';
  let html = '<button '+(currentPage===1?'disabled':'')+' onclick="gotoPage('+(currentPage-1)+')">‹ 上一页</button>';
  const pages = [];
  if(totalPage<=7){ for(let i=1;i<=totalPage;i++) pages.push(i); }
  else{
    pages.push(1);
    if(currentPage>3) pages.push("...");
    const s=Math.max(2,currentPage-1), e=Math.min(totalPage-1,currentPage+1);
    for(let i=s;i<=e;i++) pages.push(i);
    if(currentPage<totalPage-2) pages.push("...");
    pages.push(totalPage);
  }
  pages.forEach(p=>{
    if(p==="...") html += '<button disabled style="border:none;background:transparent;color:var(--gray-400)">...</button>';
    else html += '<button class="'+(p===currentPage?'active':'')+'" onclick="gotoPage('+p+')">'+p+'</button>';
  });
  html += '<button '+(currentPage===totalPage?'disabled':'')+' onclick="gotoPage('+(currentPage+1)+')">下一页 ›</button>';
  Q("pageNav").innerHTML = html;
}
function gotoPage(p){ currentPage=p; renderTable(); renderPagination(); }

function switchAction(btn){
  const act = btn.dataset.act;
  const id = btn.dataset.id;
  currentOrderId = id;
  if(act==="detail") openDetail(id);
  else if(act==="after") openAfter(id);
  else if(act==="collect") openCollect(id);
}
function findOrder(id){ return orders.find(o=>o.id===id); }

/* ====== Modal helpers ====== */
function openModal(id){
  Q(id+"Modal").classList.add("show");
  document.body.style.overflow = "hidden";
}
function closeModal(id){
  Q(id+"Modal").classList.remove("show");
  document.body.style.overflow = "";
}

/* ====== Toast ====== */
function toast(msg, type){
  type = type || "info";
  const icons = {info:"ℹ️",success:"✅",warning:"⚠️",danger:"❌"};
  const el = document.createElement("div");
  el.className = "toast "+type;
  el.innerHTML = '<span class="ti-icon">'+icons[type]+'</span><span>'+msg+'</span>';
  Q("toastContainer").appendChild(el);
  setTimeout(()=>{
    el.classList.add("fade");
    setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 300);
  }, 2400);
}

/* ====== After-Sales Modal ====== */
function openAfter(id){
  const o = findOrder(id); if(!o) return;
  currentOrderId = id;
  const asIdx = AFTER_ST.indexOf(o.afterStatus);
  let info = '<div style="font-weight:600;margin-bottom:8px">📋 '+o.id+' · '+o.customer+'</div>'
    +'<div style="font-size:12px;color:var(--gray-600);display:flex;gap:16px;flex-wrap:wrap">'
    +'<span>当前售后状态：<span class="badge badge-'+AFTER_ST_CLASS[asIdx<0?0:asIdx]+'">'+o.afterStatus+'</span></span>'
    +'<span>主状态：<span class="badge badge-'+MAIN_ST_CLASS[o.mainStatus]+'">'+MAIN_ST[o.mainStatus]+'</span></span>'
    +'<span>产品：'+o.product.substring(0,16)+(o.product.length>16?'…':'')+'</span>'
    +'</div>';
  Q("afterInfo").innerHTML = info;
  const sel = Q("afterAction");
  const opts = sel.options;
  const enableMap = {
    "无": ["submit"],
    "待复核": ["approve","reject"],
    "复核通过": ["process"],
    "处理中": ["supply","close"],
    "补录待审": ["approve","reject","close"],
    "售后完成": [],
    "复核驳回": ["submit","close"],
  };
  const enabled = enableMap[o.afterStatus] || [];
  for(let i=0;i<opts.length;i++){
    opts[i].disabled = enabled.indexOf(opts[i].value) < 0;
  }
  if(enabled.length>0) sel.value = enabled[0];
  Q("afterAdj").value = "";
  Q("afterAttach").value = "";
  Q("afterNote").value = "";
  openModal("afterModal");
}

function submitAfter(){
  const o = findOrder(currentOrderId); if(!o) return;
  const act = Q("afterAction").value;
  const note = Q("afterNote").value.trim();
  if(!note){ toast("请填写处理备注","warning"); return; }
  const statusMap = {submit:"待复核",approve:"复核通过",reject:"复核驳回",process:"处理中",supply:"补录待审",close:"售后完成"};
  const newStatus = statusMap[act];
  if(!newStatus){ toast("请选择有效处理动作","warning"); return; }
  const adjStr = Q("afterAdj").value;
  const adj = adjStr ? parseInt(adjStr)||0 : 0;
  const attach = Q("afterAttach").value.trim();
  const today = fmtDate2(new Date("2026-06-16"));
  const userMap = {submit:o.guide,approve:"王芳",reject:"王芳",process:o.measure,supply:"李婷",close:"王芳"};
  const user = userMap[act] || o.guide;
  const titleMap = {submit:"售后提交",approve:"复核通过",reject:"复核驳回",process:"开始处理",supply:"补录信息",close:"售后完成"};
  const typeMap = {submit:"primary",approve:"success",reject:"danger",process:"warning",supply:"info",close:"success"};
  let desc = note;
  if(adj!==0) desc += "（金额调整："+(adj>0?"+":"")+adj+"元）";
  if(attach) desc += " [附件："+attach+"]";
  if(!o.afterTimeline) o.afterTimeline = [];
  o.afterTimeline.push({type:typeMap[act],time:today,title:titleMap[act],desc:desc,user:user});
  if(adj!==0){
    o.adjust += adj;
    o.totalPrice = o.price + o.adjust;
    o.balance = Math.max(0, o.totalPrice - o.paid);
  }
  o.afterStatus = newStatus;
  if(act==="close" && o.mainStatus>=7){
    if(o.collectStatus==="无需催收"){ o.collectStatus = "待催收"; }
  }
  toast("✅ 售后状态已更新为【"+newStatus+"】","success");
  closeModal("afterModal");
  refresh();
}

/* ====== Collect Modal ====== */
function openCollect(id){
  const o = findOrder(id); if(!o) return;
  currentOrderId = id;
  let info = '<div class="ci-row"><span class="k">订单号</span><span class="v">'+o.id+'</span></div>'
    +'<div class="ci-row"><span class="k">客户</span><span class="v">'+o.customer+' · '+o.phone+'</span></div>'
    +'<div class="ci-row"><span class="k">订单总额</span><span class="v">¥'+fmtMoney2(o.totalPrice)+'</span></div>'
    +'<div class="ci-row"><span class="k">已付金额</span><span class="v" style="color:var(--success)">¥'+fmtMoney2(o.paid)+'</span></div>'
    +'<div class="ci-row balance"><span class="k">待收尾款</span><span class="v">¥'+fmtMoney2(o.balance)+'</span></div>';
  Q("collectInfo").innerHTML = info;
  let ccHTML = "";
  if(o.collectList.length===0){
    ccHTML = '<div style="padding:20px;text-align:center;color:var(--gray-400);font-size:13px">暂无催收记录</div>';
  } else {
    o.collectList.forEach(c=>{
      const paid = (c.type==="回款" || c.amount>0);
      ccHTML += '<div class="collectcard '+(paid?'paid':'')+'"><div class="cc-head">'
        +'<span class="cc-result" style="color:'+(paid?'var(--success)':'var(--warning)')+'">'+c.result+(c.promise?' 📅'+c.promise:'')+'</span>'
        +'<span class="cc-time">'+c.time+' · '+c.user+'</span></div>'
        +(c.amount>0?'<div class="cc-amount" style="color:var(--success)">+¥'+fmtMoney2(c.amount)+'</div>':'')
        +'<div class="cc-note">'+c.note+'</div></div>';
    });
  }
  Q("collectcards").innerHTML = ccHTML;
  Q("collectResult").value = "promise";
  Q("paidAmount").value = "";
  Q("promiseDate").value = "";
  Q("collectNote").value = "";
  openModal("collectModal");
}

function submitCollect(){const o=findOrder(currentOrderId);if(!o)return;const r=Q("collectResult").value;const note=Q("collectNote").value.trim();const pd=Q("promiseDate").value;const pa=parseFloat(Q("paidAmount").value)||0;if(!note){toast("请填写催收备注","warning");return}const user=o.guide;const typMap={promise:"客户承诺回款",paid:"客户已回款",partial:"客户部分回款",delay:"客户要求延期",bad:"失联或坏账风险"};const statusMap={promise:"承诺回款",paid:"已回款",partial:"部分回款",delay:"催收中",bad:"坏账风险"};const rec={time:fmtDate2(new Date("2026-06-16")),result:typMap[r],user:user,note:note,type:"催收"};if(r==="promise"){if(!pd){toast("请填写承诺回款日期","error");return}rec.promise=pd}if((r==="paid"||r==="partial")&&pa<=0){toast("请填写回款金额","error");return}if(r==="paid"||r==="partial"){rec.amount=pa;rec.type="回款";o.paid+=pa;o.balance=Math.max(0,(o.price+o.adjust)-o.paid)}if(r==="paid"){if(o.paid>=o.price+o.adjust){o.collectStatus="已回款";o.mainStatus=9;o.overdue=0}else{o.collectStatus="催收中"}}else{o.collectStatus=statusMap[r];if(r==="delay"){o.overdue=(o.overdue||0)+1}if(r==="bad"){o.overdue=(o.overdue||0)+7}}o.collectList.unshift(rec);toast("催收登记："+typMap[r],"success");closeModal("collectModal");refresh()}


function openBatchCollect(){
  const ids = Array.from(selected);
  const items = [];
  let totalBal = 0;
  ids.forEach(id=>{
    const o = findOrder(id); if(o){ items.push(o); totalBal += o.balance; }
  });
  let info = '<div class="bi-title">📋 已选择 '+items.length+' 个订单进行批量催收，尾款合计 ¥'+fmtMoney2(totalBal)+'</div>';
  info += '<div class="bi-list">';
  items.forEach(o=>{
    info += '<div style="padding:3px 0;display:flex;justify-content:space-between;border-bottom:1px dashed rgba(37,99,235,.15)">'
      +'<span><b style="color:var(--primary)">'+o.id+'</b> '+o.customer+'</span>'
      +'<span style="color:var(--danger);font-weight:600">尾款 ¥'+fmtMoney2(o.balance)+'</span>'
      +'</div>';
  });
  info += '</div>';
  Q("batchInfo").innerHTML = info;
  openModal("batchCollectModal");
}
function submitBatch(){
  const ids = Array.from(selected);
  const type = Q("batchType").value;
  const note = Q("batchNote").value.trim();
  const typeNameMap = {sms:"已发送催收短信",call:"电话催收完成",wechat:"微信催收完成",onsite:"上门催收完成"};
  const today = fmtDate2(new Date("2026-06-16"));
  let count = 0;
  ids.forEach(id=>{
    const o = findOrder(id); if(!o) return;
    count++;
    if(o.collectStatus==="无需催收" && o.mainStatus>=7){ o.collectStatus = "催收中"; }
    o.collectList.unshift({
      result:"批量催收",
      time: today,
      note: "【批量】"+typeNameMap[type]+"。" + (note?note:""),
      amount: 0, user:"系统批量", promise:null, type:"催收"
    });
  });
  selected.clear();
  toast("🚀 批量催收已处理："+count+"个订单","success");
  closeModal("batchCollectModal");
  refresh();
}
