spring:
  application:
    name: aesthetic-scheduling
  datasource:
    url: jdbc:h2:mem:aestheticdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: admin
    password: admin
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true

logging:
  level:
    com.medical.aesthetic: DEBUG
    org.hibernate.SQL: INFO
