server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: attendance-management

  datasource:
    url: jdbc:h2:mem:hrstaffing;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

file:
  upload-dir: /tmp/hrstaffing-uploads

export:
  base-dir: /tmp/hrstaffing-exports
