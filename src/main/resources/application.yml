spring:
  application:
    name: survey-plan-system
  datasource:
    url: jdbc:h2:mem:surveydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: admin
    password: admin123
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

app:
  jwt:
    secret: mySecretKeyForJwtTokenGenerationMustBeLongEnough123456
    expiration: 86400000

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.security.survey: DEBUG
    org.springframework.security: DEBUG
