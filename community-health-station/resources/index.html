<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社区卫生站 - 家庭签约与档案建档</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">社区</div>
        <div class="logo-text">社区卫生站</div>
      </div>
      <div class="role-selector">
        <label>当前角色</label>
        <select id="currentRole">
          <option value="全科医生">全科医生</option>
          <option value="护士">护士</option>
          <option value="公共卫生专员">公共卫生专员</option>
        </select>
      </div>
      <div class="role-display">
        <span id="roleBadge" class="role-badge role-gp">全科医生</span>
        <span id="operatorName" class="operator-name">陈志远</span>
      </div>
      <nav id="nav">
        <a href="#" class="nav-item active" data-page="contract-list">
          <span class="nav-icon">📋</span>家庭签约
          <span id="contractBadge" class="nav-badge">0</span>
        </a>
        <a href="#" class="nav-item" data-page="archive-list">
          <span class="nav-icon">📁</span>档案建档
          <span id="archiveBadge" class="nav-badge">0</span>
        </a>
        <a href="#" class="nav-item" data-page="batch-entry">
          <span class="nav-icon">📝</span>批量录入
        </a>
        <a href="#" class="nav-item" data-page="recent">
          <span class="nav-icon">🕐</span>最近打开
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="btnResetData" class="btn-text">重置演示数据</button>
      </div>
    </aside>
    <main id="main">
      <header id="topbar">
        <div class="topbar-left">
          <h1 id="pageTitle">家庭签约</h1>
          <span id="pageSubtitle" class="page-subtitle"></span>
        </div>
        <div class="topbar-right">
          <div id="notificationBell" class="notification-bell">
            <span class="bell-icon">🔔</span>
            <span id="notifCount" class="notif-count" style="display:none">0</span>
          </div>
          <div id="notifPanel" class="notif-panel" style="display:none">
            <div class="notif-header">
              <span>通知</span>
              <button id="btnMarkAllRead" class="btn-text">全部已读</button>
            </div>
            <div id="notifList" class="notif-list"></div>
          </div>
        </div>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <div id="modal" class="modal-overlay" style="display:none">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button id="modalClose" class="modal-close">&times;</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFooter" class="modal-footer"></div>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none"></div>

  <script src="js/store.js"></script>
  <script src="js/contract.js"></script>
  <script src="js/archive.js"></script>
  <script src="js/batch.js"></script>
  <script src="js/recent.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
