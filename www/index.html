<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨境电商退件管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">📦</div>
                <h1>退件管理系统</h1>
            </div>
            <nav class="nav-menu">
                <div class="nav-item active" data-page="dashboard">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-text">最近打开</span>
                </div>
                <div class="nav-section-title">工作台</div>
                <div class="nav-item" data-page="operations-desk">
                    <span class="nav-icon">📝</span>
                    <span class="nav-text">运营登记</span>
                    <span class="nav-badge" id="ops-badge">0</span>
                </div>
                <div class="nav-item" data-page="warehouse-desk">
                    <span class="nav-icon">🏭</span>
                    <span class="nav-text">仓配处理</span>
                    <span class="nav-badge" id="wh-badge">0</span>
                </div>
                <div class="nav-item" data-page="customs-desk">
                    <span class="nav-icon">📑</span>
                    <span class="nav-text">关务审核</span>
                    <span class="nav-badge" id="cus-badge">0</span>
                </div>
                <div class="nav-item" data-page="restock-desk">
                    <span class="nav-icon">📥</span>
                    <span class="nav-text">待上架单</span>
                    <span class="nav-badge" id="rs-badge">0</span>
                </div>
                <div class="nav-section-title">查询</div>
                <div class="nav-item" data-page="restock">
                    <span class="nav-icon">✅</span>
                    <span class="nav-text">上架记录</span>
                </div>
                <div class="nav-section-title">系统</div>
                <div class="nav-item" data-page="history">
                    <span class="nav-icon">📋</span>
                    <span class="nav-text">操作历史</span>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">👤</div>
                    <div class="user-detail">
                        <div class="user-name" id="current-user">仓配专员</div>
                        <div class="user-role">已登录</div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumb">
                    <span id="breadcrumb">最近打开</span>
                </div>
                <div class="top-actions">
                    <div class="role-switcher">
                        <select id="role-select">
                            <option value="warehouse">仓配专员</option>
                            <option value="operations">运营</option>
                            <option value="customs">关务</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="btn-refresh">
                        🔄 刷新数据
                    </button>
                </div>
            </header>

            <div class="page-container" id="page-container">
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 id="modal-title">详情</h3>
                <button class="modal-close" id="modal-close">×</button>
            </div>
            <div class="modal-body" id="modal-body">
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/app.js"></script>
</body>
</html>
