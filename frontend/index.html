<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水产养殖场 - 投喂计划与饲料领用</title>
<style>
:root{--primary:#1a73e8;--primary-light:#e8f0fe;--success:#34a853;--success-light:#e6f4ea;--warning:#ea8600;--warning-light:#fef7e0;--danger:#d93025;--danger-light:#fce8e6;--gray:#5f6368;--gray-light:#f1f3f4;--gray-border:#dadce0;--bg:#f8f9fa;--card-bg:#fff;--text:#202124;--text-secondary:#80868b;--shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);--shadow-lg:0 4px 12px rgba(0,0,0,.15);--radius:8px;--transition:.25s ease}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.login-wrapper{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a73e8,#0d47a1)}
.login-card{background:var(--card-bg);border-radius:12px;padding:48px 40px;width:400px;max-width:90vw;box-shadow:var(--shadow-lg)}
.login-card h1{font-size:22px;text-align:center;margin-bottom:8px}
.login-card .subtitle{text-align:center;color:var(--text-secondary);font-size:14px;margin-bottom:32px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--gray-border);border-radius:var(--radius);font-size:14px;outline:none;font-family:inherit;transition:border-color var(--transition)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(26,115,232,.2)}
.form-group textarea{resize:vertical;min-height:60px}
.login-error{background:var(--danger-light);color:var(--danger);padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 20px;border:none;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;transition:all var(--transition);font-family:inherit;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:#1557b0}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover:not(:disabled){background:#2d8e47}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){background:#b3261e}
.btn-outline{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn-outline:hover:not(:disabled){background:var(--primary-light)}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-block{width:100%}
.topbar{background:var(--card-bg);border-bottom:1px solid var(--gray-border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:12px;font-weight:600;font-size:16px}
.topbar-left .logo{width:32px;height:32px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.topbar-right{display:flex;align-items:center;gap:16px}
.user-info{font-size:14px}
.user-info .name{font-weight:600}
.role-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;margin-left:6px}
.role-tag.technician{background:#e8f0fe;color:var(--primary)}
.role-tag.warehouse{background:var(--warning-light);color:var(--warning)}
.role-tag.manager{background:var(--success-light);color:var(--success)}
.role-select{padding:6px 10px;border:1px solid var(--gray-border);border-radius:var(--radius);font-size:13px;outline:none;cursor:pointer}
.btn-logout{padding:6px 14px;background:transparent;border:1px solid var(--gray-border);border-radius:var(--radius);font-size:13px;cursor:pointer;color:var(--text-secondary)}
.btn-logout:hover{border-color:var(--danger);color:var(--danger)}
.main-container{max-width:1200px;margin:0 auto;padding:24px}
.tabs{display:flex;gap:0;margin-bottom:24px;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.tab-btn{flex:1;padding:14px 24px;background:transparent;border:none;font-size:15px;font-weight:500;cursor:pointer;color:var(--text-secondary);border-bottom:3px solid transparent;font-family:inherit;transition:all var(--transition)}.chip:hover{background:var(--primary-light);color:var(--primary)}.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}.chip-draft.active{background:var(--gray);border-color:var(--gray)}.chip-submitted.active{background:var(--primary);border-color:var(--primary)}.chip-approved.active{background:var(--success);border-color:var(--success)}.chip-rejected.active{background:var(--danger);border-color:var(--danger)}.chip-pending.active{background:var(--warning);border-color:var(--warning)}.chip-issued.active{background:var(--primary);border-color:var(--primary)}.chip-received.active{background:var(--success);border-color:var(--success)}
.tab-btn:hover{color:var(--text);background:var(--gray-light)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--primary-light)}
.action-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.action-bar-right{display:flex;align-items:center;gap:10px}.status-chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:16px;font-size:13px;cursor:pointer;background:var(--gray-light);color:var(--text-secondary);border:1px solid transparent;transition:all var(--transition)}
.action-bar h2{font-size:18px;font-weight:600}
.card-list{display:flex;flex-direction:column;gap:12px}
.card-item{background:var(--card-bg);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);cursor:pointer;transition:all var(--transition);border-left:4px solid transparent}
.card-item:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.card-item.status-draft{border-left-color:var(--gray)}
.card-item.status-submitted{border-left-color:var(--primary)}
.card-item.status-approved{border-left-color:var(--success)}
.card-item.status-rejected{border-left-color:var(--danger)}
.card-item.status-pending{border-left-color:var(--warning)}
.card-item.status-issued{border-left-color:var(--primary)}
.card-item.status-received{border-left-color:var(--success)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-title{font-size:15px;font-weight:600}
.card-meta{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--text-secondary)}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500}
.badge-draft{background:var(--gray-light);color:var(--gray)}
.badge-submitted{background:var(--primary-light);color:var(--primary)}
.badge-approved{background:var(--success-light);color:var(--success)}
.badge-rejected{background:var(--danger-light);color:var(--danger)}
.badge-pending{background:var(--warning-light);color:var(--warning)}
.badge-issued{background:var(--primary-light);color:var(--primary)}
.badge-received{background:var(--success-light);color:var(--success)}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;animation:fadeIn .2s ease}
.drawer-panel{position:fixed;top:0;right:0;width:520px;max-width:90vw;height:100vh;background:var(--card-bg);z-index:201;overflow-y:auto;box-shadow:-4px 0 16px rgba(0,0,0,.15);animation:slideInRight .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drawer-header{padding:20px 24px;border-bottom:1px solid var(--gray-border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card-bg);z-index:1}
.drawer-header h3{font-size:17px;font-weight:600}
.drawer-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--gray-light);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.drawer-close:hover{background:var(--gray-border)}
.drawer-body{padding:24px}
.detail-section{margin-bottom:24px}
.detail-section h4{font-size:14px;font-weight:600;color:var(--text-secondary);letter-spacing:.5px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--gray-border)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-item{font-size:14px}
.detail-item .label{color:var(--text-secondary);font-size:12px;margin-bottom:2px}
.detail-item .value{font-weight:500}
.timeline{position:relative;padding-left:28px}
.timeline::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--gray-border)}
.timeline-entry{position:relative;padding-bottom:20px}
.timeline-entry:last-child{padding-bottom:0}
.timeline-dot{position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary-light)}
.timeline-entry:first-child .timeline-dot{background:var(--success);box-shadow:0 0 0 2px var(--success-light)}
.timeline-status{font-size:14px;font-weight:500;margin-bottom:4px}
.timeline-meta{font-size:12px;color:var(--text-secondary);display:flex;flex-wrap:wrap;gap:12px}
.timeline-remark{margin-top:6px;font-size:13px;color:var(--text);background:var(--gray-light);padding:6px 10px;border-radius:4px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.modal-box{background:var(--card-bg);border-radius:12px;width:480px;max-width:90vw;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:modalIn .2s ease}
@keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--gray-border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:16px;font-weight:600}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--gray-border);display:flex;justify-content:flex-end;gap:10px}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.toast-container{position:fixed;top:72px;right:24px;z-index:500;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card-bg);border-radius:var(--radius);padding:12px 20px;box-shadow:var(--shadow-lg);font-size:14px;border-left:4px solid var(--primary);animation:toastIn .3s ease;max-width:360px}
.toast.toast-success{border-left-color:var(--success)}
.toast.toast-error{border-left-color:var(--danger)}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:768px){.topbar{padding:0 16px}.main-container{padding:16px}.drawer-panel{width:100vw;max-width:100vw}.detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
<div class="toast-container"><div v-for="t in toasts" :key="t.id" :class="['toast','toast-'+t.type]">{{t.message}}</div></div>
<div v-if="!user" class="login-wrapper"><div class="login-card">
<h1>🐟 水产养殖场</h1><p class="subtitle">投喂计划与饲料领用管理系统</p>
<div v-if="loginError" class="login-error">{{loginError}}</div>
<div class="form-group"><label>用户名</label><input v-model="loginForm.username" @keyup.enter="login" placeholder="请输入用户名"/></div>
<div class="form-group"><label>密码</label><input v-model="loginForm.password" @keyup.enter="login" type="password" placeholder="请输入密码"/></div>
<button class="btn btn-primary btn-block" @click="login" >登录</button>
</div></div>
<template v-else>
<div class="topbar">
<div class="topbar-left"><div class="logo">🐟</div><span>水产养殖场管理系统</span></div>
<div class="topbar-right">
<div class="user-info"><span class="name">{{user.name}}</span><span :class="['role-tag',currentRole]">{{roleLabel(currentRole)}}</span></div>
<select class="role-select" v-model="currentRole"><option value="technician">技术员</option><option value="warehouse">仓管</option><option value="manager">场长</option></select>
<button class="btn-logout" @click="logout">退出</button>
</div></div>
<div class="main-container">
<div class="tabs">
<button :class="['tab-btn',{active:activeTab==='plans'}]" @click="activeTab='plans'">📋 投喂计划</button>
<button :class="['tab-btn',{active:activeTab==='requisitions'}]" @click="activeTab='requisitions'">📦 饲料领用</button>
</div>
<div v-if="activeTab==='plans'">
<div class="action-bar"><h2>投喂计划列表</h2><div class="action-bar-right"><select class="role-select" v-model="planStatusFilter"><option value="">全部</option><option value="draft">草稿</option><option value="submitted">待审核</option><option value="approved">已批准</option><option value="rejected">已驳回</option></select><button v-if="currentRole==='technician'" class="btn btn-primary" @click="showCreatePlan=true">+ 新建计划</button></div></div>
<div class="status-chips"><span :class="['chip',{active:planStatusFilter===''}]" @click="planStatusFilter=''">全部 {{plans.length}}</span><span :class="['chip','chip-draft',{active:planStatusFilter==='draft'}]" @click="planStatusFilter='draft'">草稿 {{planCounts.draft}}</span><span :class="['chip','chip-submitted',{active:planStatusFilter==='submitted'}]" @click="planStatusFilter='submitted'">待审核 {{planCounts.submitted}}</span><span :class="['chip','chip-approved',{active:planStatusFilter==='approved'}]" @click="planStatusFilter='approved'">已批准 {{planCounts.approved}}</span><span :class="['chip','chip-rejected',{active:planStatusFilter==='rejected'}]" @click="planStatusFilter='rejected'">已驳回 {{planCounts.rejected}}</span></div>
<div v-if="plansLoading" class="empty-state"><p>加载中...</p></div>
<div v-else-if="plans.length===0" class="empty-state"><div class="icon">📋</div><p>暂无投喂计划</p></div>
<div v-else-if="filteredPlans.length===0" class="empty-state"><div class="icon">📋</div><p>无匹配记录</p></div>
<div v-else class="card-list">
<div v-for="p in filteredPlans" :key="p.id" :class="['card-item','status-'+p.status]" @click="openPlanDetail(p)">
<div class="card-header"><span class="card-title">{{p.plan_no}}</span><span :class="['badge','badge-'+p.status]">{{statusLabel(p.status)}}</span></div>
<div class="card-meta"><span>塘号: {{p.pond_no}}</span><span>品种: {{p.breed_type}}</span><span>饲料: {{p.feed_type}}</span><span>日投量: {{p.daily_amount}}kg</span><span>创建人: {{p.created_by}}</span></div>
</div></div></div>
<div v-if="activeTab==='requisitions'">
<div class="action-bar"><h2>饲料领用列表</h2><div class="action-bar-right"><select class="role-select" v-model="reqStatusFilter"><option value="">全部</option><option value="pending">待发料</option><option value="issued">已发料</option><option value="received">已收料</option></select><button v-if="currentRole==='technician'" class="btn btn-primary" @click="showCreateReq=true">+ 申请领用</button></div></div>
<div class="status-chips"><span :class="['chip',{active:reqStatusFilter===''}]" @click="reqStatusFilter=''">全部 {{requisitions.length}}</span><span :class="['chip','chip-pending',{active:reqStatusFilter==='pending'}]" @click="reqStatusFilter='pending'">待发料 {{reqCounts.pending}}</span><span :class="['chip','chip-issued',{active:reqStatusFilter==='issued'}]" @click="reqStatusFilter='issued'">已发料 {{reqCounts.issued}}</span><span :class="['chip','chip-received',{active:reqStatusFilter==='received'}]" @click="reqStatusFilter='received'">已收料 {{reqCounts.received}}</span></div>
<div v-if="reqsLoading" class="empty-state"><p>加载中...</p></div>
<div v-else-if="requisitions.length===0" class="empty-state"><div class="icon">📦</div><p>暂无领用记录</p></div>
<div v-else-if="filteredRequisitions.length===0" class="empty-state"><div class="icon">📦</div><p>无匹配记录</p></div>
<div v-else class="card-list">
<div v-for="r in filteredRequisitions" :key="r.id" :class="['card-item','status-'+r.status]" @click="openReqDetail(r)">
<div class="card-header"><span class="card-title">{{r.req_no}}</span><span :class="['badge','badge-'+r.status]">{{reqStatusLabel(r.status)}}</span></div>
<div class="card-meta"><span>塘号: {{r.pond_no}}</span><span>饲料: {{r.feed_type}}</span><span>数量: {{r.amount}}kg</span><span>申请人: {{r.requested_by}}</span></div>
</div></div></div></div>
<template v-if="planDrawer">
<div class="drawer-overlay" @click="planDrawer=null"></div>
<div class="drawer-panel">
<div class="drawer-header"><h3>投喂计划详情</h3><button class="drawer-close" @click="planDrawer=null">&times;</button></div>
<div class="drawer-body">
<div class="detail-section"><h4>基本信息</h4>
<div class="detail-grid">
<div class="detail-item"><div class="label">计划编号</div><div class="value">{{planDrawer.plan_no}}</div></div>
<div class="detail-item"><div class="label">状态</div><div class="value"><span :class="['badge','badge-'+planDrawer.status]">{{statusLabel(planDrawer.status)}}</span></div></div>
<div class="detail-item"><div class="label">塘号</div><div class="value">{{planDrawer.pond_no}}</div></div>
<div class="detail-item"><div class="label">养殖品种</div><div class="value">{{planDrawer.breed_type}}</div></div>
<div class="detail-item"><div class="label">饲料类型</div><div class="value">{{planDrawer.feed_type}}</div></div>
<div class="detail-item"><div class="label">日投喂量</div><div class="value">{{planDrawer.daily_amount}} kg</div></div>
<div class="detail-item"><div class="label">投喂频率</div><div class="value">{{planDrawer.frequency}}</div></div>
<div class="detail-item"><div class="label">开始日期</div><div class="value">{{planDrawer.start_date}}</div></div>
<div class="detail-item"><div class="label">结束日期</div><div class="value">{{planDrawer.end_date}}</div></div>
<div class="detail-item"><div class="label">创建人</div><div class="value">{{planDrawer.created_by}}</div></div>
</div>
<div v-if="planDrawer.remark" class="detail-item" style="margin-top:12px"><div class="label">备注</div><div class="value">{{planDrawer.remark}}</div></div>
</div>
<div class="detail-section"><h4>状态流转</h4>
<div v-if="planDrawer.status_logs&&planDrawer.status_logs.length" class="timeline">
<div v-for="(log,idx) in planDrawer.status_logs" :key="idx" class="timeline-entry">
<div class="timeline-dot"></div>
<div class="timeline-status">{{statusLabel(log.from_status)}} → {{statusLabel(log.to_status)}}</div>
<div class="timeline-meta"><span>{{log.operator}}</span><span>{{log.operator_role}}</span><span>{{log.operated_at}}</span></div>
<div v-if="log.remark" class="timeline-remark">{{log.remark}}</div>
</div></div>
<div v-else style="color:var(--text-secondary);font-size:14px">暂无状态记录</div></div>
<div class="detail-section"><h4>操作</h4><div style="display:flex;flex-wrap:wrap;gap:10px">
<button v-if="currentRole==='technician'&&planDrawer.status==='draft'" class="btn btn-primary btn-sm" @click="submitPlan(planDrawer)">提交审核</button>
<button v-if="currentRole==='manager'&&planDrawer.status==='submitted'" class="btn btn-success btn-sm" @click="approvePlan(planDrawer)">审核通过</button>
<button v-if="currentRole==='manager'&&planDrawer.status==='submitted'" class="btn btn-danger btn-sm" @click="openRejectPlanModal(planDrawer)">驳回</button>
</div></div></div></div></template>
<template v-if="reqDrawer">
<div class="drawer-overlay" @click="reqDrawer=null"></div>
<div class="drawer-panel">
<div class="drawer-header"><h3>饲料领用详情</h3><button class="drawer-close" @click="reqDrawer=null">&times;</button></div>
<div class="drawer-body">
<div class="detail-section"><h4>领用信息</h4><div class="detail-grid">
<div class="detail-item"><div class="label">领用编号</div><div class="value">{{reqDrawer.req_no}}</div></div>
<div class="detail-item"><div class="label">状态</div><div class="value"><span :class="['badge','badge-'+reqDrawer.status]">{{reqStatusLabel(reqDrawer.status)}}</span></div></div>
<div class="detail-item"><div class="label">塘号</div><div class="value">{{reqDrawer.pond_no}}</div></div>
<div class="detail-item"><div class="label">饲料类型</div><div class="value">{{reqDrawer.feed_type}}</div></div>
<div class="detail-item"><div class="label">数量</div><div class="value">{{reqDrawer.amount}} kg</div></div>
<div class="detail-item"><div class="label">申请人</div><div class="value">{{reqDrawer.requested_by}}</div></div>
<div class="detail-item"><div class="label">关联计划</div><div class="value">{{reqDrawer.feeding_plan_id}}</div></div>
</div></div>
<div class="detail-section"><h4>状态流转</h4>
<div v-if="reqDrawer.status_logs&&reqDrawer.status_logs.length" class="timeline">
<div v-for="(log,idx) in reqDrawer.status_logs" :key="idx" class="timeline-entry">
<div class="timeline-dot"></div>
<div class="timeline-status">{{reqStatusLabel(log.from_status)}} → {{reqStatusLabel(log.to_status)}}</div>
<div class="timeline-meta"><span>{{log.operator}}</span><span>{{log.operator_role}}</span><span>{{log.operated_at}}</span></div>
<div v-if="log.remark" class="timeline-remark">{{log.remark}}</div></div></div>
<div v-else style="color:var(--text-secondary);font-size:14px">暂无状态记录</div></div>
<div class="detail-section"><h4>操作</h4><div style="display:flex;flex-wrap:wrap;gap:10px">
<button v-if="currentRole==='technician'&&reqDrawer.status==='issued'" class="btn btn-success btn-sm" @click="receiveReq(reqDrawer)">确认收料</button>
<button v-if="currentRole==='warehouse'&&reqDrawer.status==='pending'" class="btn btn-primary btn-sm" @click="issueReq(reqDrawer)">确认发料</button>
</div></div></div></div></template>
<div v-if="showCreatePlan" class="modal-overlay" @click.self="showCreatePlan=false">
<div class="modal-box"><div class="modal-header"><h3>新建投喂计划</h3><button @click="showCreatePlan=false">&times;</button></div>
<div class="modal-body">
<div class="form-group"><label>塘号</label><input v-model="planForm.pond_no" /></div>
<div class="form-group"><label>养殖品种</label><input v-model="planForm.breed_type" /></div>
<div class="form-group"><label>饲料类型</label><input v-model="planForm.feed_type" /></div>
<div class="form-group"><label>日投喂量(kg)</label><input v-model="planForm.daily_amount" type="number" /></div>
<div class="form-group"><label>投喂频率</label><input v-model="planForm.frequency" /></div>
<div class="form-group"><label>开始日期</label><input v-model="planForm.start_date" type="date" /></div>
<div class="form-group"><label>结束日期</label><input v-model="planForm.end_date" type="date" /></div>
<div class="form-group"><label>备注</label><input v-model="planForm.remark" /></div>
</div><div class="modal-footer"><button class="btn btn-outline" @click="showCreatePlan=false">取消</button><button class="btn btn-primary" @click="createPlan">创建</button></div></div></div>
<div v-if="showCreateReq" class="modal-overlay" @click.self="showCreateReq=false">
<div class="modal-box"><div class="modal-header"><h3>申请领用</h3><button @click="showCreateReq=false">&times;</button></div><div class="modal-body">
<div class="form-group"><label>关联计划</label><select v-model="reqForm.feeding_plan_id"><option value="">请选择</option><option v-for="p in approvedPlans" :key="p.id" :value="p.id">{{p.plan_no}} - {{p.pond_no}}</option></select></div>
<div class="form-group"><label>塘号</label><input v-model="reqForm.pond_no" /></div>
<div class="form-group"><label>饲料类型</label><input v-model="reqForm.feed_type" /></div>
<div class="form-group"><label>数量(kg)</label><input v-model="reqForm.amount" type="number" /></div>
<div class="form-group"><label>备注</label><input v-model="reqForm.remark" /></div>
</div><div class="modal-footer"><button class="btn btn-outline" @click="showCreateReq=false">取消</button><button class="btn btn-primary" @click="createReq">提交</button></div></div></div>
<div v-if="showRejectPlan" class="modal-overlay" @click.self="showRejectPlan=false">
<div class="modal-box"><div class="modal-header"><h3>驳回计划</h3><button @click="showRejectPlan=false">&times;</button></div>
<div class="modal-body"><div class="form-group"><label>驳回原因</label><input v-model="rejectRemark" /></div></div>
<div class="modal-footer"><button class="btn btn-outline" @click="showRejectPlan=false">取消</button><button class="btn btn-danger" @click="rejectPlan">确认驳回</button></div></div></div>
</div></div></div>
</template>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
const {createApp,ref,computed,onMounted,watch}=Vue
createApp({setup(){
const API='http://localhost:8000/api'
const user=ref(null);const currentRole=ref('technician');const activeTab=ref('plans')
const plans=ref([]);const requisitions=ref([]);const plansLoading=ref(false);const reqsLoading=ref(false)
const planDrawer=ref(null);const reqDrawer=ref(null)
const showCreatePlan=ref(false);const showCreateReq=ref(false);const showRejectPlan=ref(false)
const rejectRemark=ref("");const rejectTarget=ref(null)
const loginForm=ref({username:"",password:""});const loginError=ref("")
const planForm=ref({pond_no:"",breed_type:"",feed_type:"",daily_amount:"",frequency:"",start_date:"",end_date:"",remark:""})
const reqForm=ref({feeding_plan_id:"",pond_no:"",feed_type:"",amount:"",remark:""})
const toasts=ref([])
const planStatusFilter=ref('');const reqStatusFilter=ref('')
const approvedPlans=computed(()=>plans.value.filter(p=>p.status==='approved'))
const filteredPlans=computed(()=>planStatusFilter.value?plans.value.filter(p=>p.status===planStatusFilter.value):plans.value)
const filteredRequisitions=computed(()=>reqStatusFilter.value?requisitions.value.filter(r=>r.status===reqStatusFilter.value):requisitions.value)
const planCounts=computed(()=>{const c={draft:0,submitted:0,approved:0,rejected:0};plans.value.forEach(p=>{if(c[p.status]!==undefined)c[p.status]++});return c})
const reqCounts=computed(()=>{const c={pending:0,issued:0,received:0};requisitions.value.forEach(r=>{if(c[r.status]!==undefined)c[r.status]++});return c})
function toast(msg,type='info'){const id=Date.now();toasts.value.push({id,msg,type});setTimeout(()=>{toasts.value=toasts.value.filter(t=>t.id!==id)},3000)}
function statusLabel(s){const m={draft:'草稿',submitted:'待审核',approved:'已批准',rejected:'已驳回'};return m[s]||s}
function reqStatusLabel(s){const m={pending:'待发料',issued:'已发料',received:'已收料'};return m[s]||s}
function roleLabel(r){const m={technician:'技术员',warehouse:'仓管',manager:'场长'};return m[r]||r}
async function apiFetch(url,opts={}){try{const r=await fetch(API+url,{headers:{"Content-Type":"application/json"},...opts});if(!r.ok)throw new Error(r.statusText);return await r.json()}catch(e){toast(e.message,'error');throw e}}
async function login(){try{const d=await apiFetch('/login',{method:'POST',body:JSON.stringify(loginForm.value)});user.value=d;currentRole.value=d.role||'technician';loginError.value="";fetchPlans();fetchRequisitions()}catch(e){loginError.value='登录失败'}}
function logout(){user.value=null;plans.value=[];requisitions.value=[]}
async function fetchPlans(){plansLoading.value=true;try{const d=await apiFetch('/feeding-plans');plans.value=Array.isArray(d)?d:d.items||[]}finally{plansLoading.value=false}}
async function fetchRequisitions(){reqsLoading.value=true;try{const d=await apiFetch('/feed-requisitions');requisitions.value=Array.isArray(d)?d:d.items||[]}finally{reqsLoading.value=false}}
async function createPlan(){try{const body={...planForm.value,created_by:user.value.username};await apiFetch('/feeding-plans',{method:'POST',body:JSON.stringify(body)});showCreatePlan.value=false;planForm.value={pond_no:"",breed_type:"",feed_type:"",daily_amount:"",frequency:"",start_date:"",end_date:"",remark:""};toast('创建成功','success');fetchPlans()}catch(e){}}
async function submitPlan(p){try{await apiFetch('/feeding-plans/'+p.id+'/submit',{method:'PUT',body:JSON.stringify({status:user.value.username,remark:""})});toast('提交成功','success');fetchPlans();openPlanDetail(p)}catch(e){}}
async function approvePlan(p){try{await apiFetch('/feeding-plans/'+p.id+'/approve',{method:'PUT',body:JSON.stringify({status:user.value.username,remark:""})});toast('审核通过','success');fetchPlans();openPlanDetail(p)}catch(e){}}
function openRejectPlanModal(p){rejectTarget.value=p;showRejectPlan.value=true}
async function rejectPlan(){try{await apiFetch('/feeding-plans/'+rejectTarget.value.id+'/reject',{method:'PUT',body:JSON.stringify({status:user.value.username,remark:rejectRemark.value})});showRejectPlan.value=false;rejectRemark.value="";toast('已驳回','success');fetchPlans()}catch(e){}}
async function createReq(){try{const body={...reqForm.value,requested_by:user.value.username};await apiFetch('/feed-requisitions',{method:'POST',body:JSON.stringify(body)});showCreateReq.value=false;reqForm.value={feeding_plan_id:"",pond_no:"",feed_type:"",amount:"",remark:""};toast('申请成功','success');fetchRequisitions()}catch(e){}}
async function issueReq(r){try{await apiFetch('/feed-requisitions/'+r.id+'/issue',{method:'PUT',body:JSON.stringify({status:user.value.username,remark:""})});toast('已发料','success');fetchRequisitions();openReqDetail(r)}catch(e){}}
async function receiveReq(r){try{await apiFetch('/feed-requisitions/'+r.id+'/receive',{method:'PUT',body:JSON.stringify({status:user.value.username,remark:""})});toast('已收料','success');fetchRequisitions();openReqDetail(r)}catch(e){}}
async function openPlanDetail(p){try{const d=await apiFetch('/feeding-plans/'+p.id);planDrawer.value=d}catch(e){planDrawer.value=p}}
async function openReqDetail(r){try{const d=await apiFetch('/feed-requisitions/'+r.id);reqDrawer.value=d}catch(e){reqDrawer.value=r}}
return{user,currentRole,activeTab,plans,requisitions,plansLoading,reqsLoading,planDrawer,reqDrawer,showCreatePlan,showCreateReq,showRejectPlan,rejectRemark,planForm,reqForm,loginForm,loginError,toasts,approvedPlans,planStatusFilter,reqStatusFilter,filteredPlans,filteredRequisitions,planCounts,reqCounts,login,logout,statusLabel,reqStatusLabel,roleLabel,fetchPlans,fetchRequisitions,createPlan,submitPlan,approvePlan,openRejectPlanModal,rejectPlan,createReq,issueReq,receiveReq,openPlanDetail,openReqDetail}
}}).mount('#app')
</script>
</body></html>
