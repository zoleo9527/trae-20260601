<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安防工程商管理系统</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'status-pending': '#eab308',
            'status-progress': '#3b82f6',
            'status-submitted': '#8b5cf6',
            'status-reviewing': '#f97316',
            'status-approved': '#22c55e',
            'status-rejected': '#ef4444',
            'status-stuck': '#dc2626',
            'status-confirmed': '#10b981',
            'status-revised': '#6366f1',
            'status-customer': '#06b6d4',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app">
    <div id="login-view" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
      <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">安防工程商管理系统</h1>
        <p class="text-center text-gray-500 mb-8">点位勘察与方案确认</p>
        
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
            <input type="text" id="username" placeholder="请输入用户名" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
            <input type="password" id="password" placeholder="请输入密码" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
          <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-medium transition">登录</button>
        </div>
        
        <div class="mt-6 p-4 bg-gray-50 rounded-lg">
          <p class="text-sm font-medium text-gray-700 mb-2">测试账号：</p>
          <div class="space-y-1 text-sm text-gray-600">
            <p><span class="font-mono bg-gray-200 px-1">pm</span> / 123456 - 项目经理</p>
            <p><span class="font-mono bg-gray-200 px-1">leader</span> / 123456 - 施工队长</p>
            <p><span class="font-mono bg-gray-200 px-1">engineer</span> / 123456 - 售后工程师</p>
          </div>
        </div>
        
        <div id="login-error" class="hidden mt-4 p-3 bg-red-50 text-red-700 rounded-lg text-sm"></div>
      </div>
    </div>

    <div id="main-view" class="hidden">
      <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex justify-between h-16 items-center">
            <div class="flex space-x-8">
              <a href="#" onclick="showView('dashboard')" class="nav-link text-gray-600 hover:text-blue-600 px-3 py-2 text-sm font-medium" data-view="dashboard">卡住看板</a>
              <a href="#" onclick="showView('surveys')" class="nav-link text-gray-600 hover:text-blue-600 px-3 py-2 text-sm font-medium" data-view="surveys">点位勘察</a>
              <a href="#" onclick="showView('plans')" class="nav-link text-gray-600 hover:text-blue-600 px-3 py-2 text-sm font-medium" data-view="plans">方案确认</a>
            </div>
            <div class="flex items-center space-x-4">
              <span id="user-info" class="text-sm text-gray-600"></span>
              <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800">退出登录</button>
            </div>
          </div>
        </div>
      </nav>

      <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="dashboard-view" class="view"></div>
        <div id="surveys-view" class="view hidden"></div>
        <div id="plans-view" class="view hidden"></div>
        <div id="survey-detail-view" class="view hidden"></div>
        <div id="plan-detail-view" class="view hidden"></div>
        <div id="plan-new-view" class="view hidden"></div>
      </main>
    </div>
  </div>

  <div id="toast" class="fixed top-4 right-4 z-50 hidden"></div>
  <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
    <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4">
      <h3 id="modal-title" class="text-lg font-semibold mb-4"></h3>
      <div id="modal-body" class="mb-4"></div>
      <div class="flex justify-end space-x-3">
        <button onclick="closeModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">取消</button>
        <button id="modal-confirm-btn" onclick="modalConfirmAction()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">确认</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
